name: Build PHP SDK
run-name: "Build PHP ${{ inputs.php_version }}"

on:
  workflow_dispatch:
    inputs:
      php_version:
        description: "PHP version to build (e.g. 8.5.2, 8.4.7, 8.3.20)"
        required: true
        type: string
      platform:
        description: "Which platform(s) to build. Partial builds upload the
          new tarball to the existing release; tarballs for unbuilt
          platforms stay put. The -nts entries build a non-thread-safe
          embed SDK and are deliberately NOT part of `all` (see the
          build-linux matrix comment)."
        required: false
        type: choice
        default: all
        options:
          - all
          - linux-x86_64
          - linux-aarch64
          - linux-x86_64-gnu
          - linux-aarch64-gnu
          - linux-x86_64-gnu-nts
          - linux-aarch64-gnu-nts
          - linux-x86_64-gnu-nts-shared
          - linux-aarch64-gnu-nts-shared
          - macos-aarch64
          - windows-x86_64
          - windows-x86_64-clang
      release_tag_suffix:
        description: "Suffix appended to the release tag (uploads go to
          v<php_version><suffix>). Test/validation branches MUST set a
          suffix (e.g. -forktest) so they can never contaminate production
          tags. Incident 2026-07-13: a validation build dispatched from a
          side branch uploaded to plain v8.5.7 and overwrote 4 production
          assets (since restored). Leave empty for production releases."
        required: false
        type: string
        default: ""

env:
  SPC_VERSION: "v3.0.0-pgo-rc19"
  # OPcache's supported_sapis allowlist (PHP < 8.5 only; 8.5 removed it)
  # rejects SAPI names it doesn't know, so embed-based runtimes get
  # opcache_get_status() === false even with opcache.enable=1. The spc fork
  # patches the list at build time from this comma-separated env var
  # (src/Package/Extension/opcache.php, since rc18). Unset defaults to
  # "ephpm" alone; "embed" is added for consumers embedding libphp under the
  # stock embed SAPI name (PAM).
  SPC_OPCACHE_EXTRA_SAPIS: "ephpm,embed"
  # Linux + macOS extension set (sorted, including Unix-only IPC + process
  # control extensions). Windows uses WIN_PHP_EXTENSIONS — keep the two
  # in sync EXCEPT for the Unix-only entries (pcntl, posix, sysv*).
  #
  # NOTE on mbregex: spc builds mbstring with --disable-mbregex UNLESS the
  # separate `mbregex` extension is also requested (it pulls in oniguruma).
  # Without it, mb_split()/mb_ereg*() are undefined — which breaks Laravel's
  # Str::studly() and any framework using the mbstring regex functions. Keep
  # `mbregex` in BOTH lists alongside `mbstring`.
  #
  # NOTE on shmop/sockets: added for downstream consumers that ship them
  # (PAM's reviewed extension surface). They are NOT in WIN_PHP_EXTENSIONS —
  # PHP supports both on Windows, but neither has ever been through spc's
  # Windows toolchain here and the Windows leg is the longest and most
  # fragile in this workflow. Validate with a `release_tag_suffix` dispatch
  # before adding them there.
  #
  # NOTE on ffi: deliberately absent. spc's ext-ffi passes
  # `--enable-zend-signals`, and its extension args land AFTER the target
  # args on the configure line (src/Package/Target/php/unix.php builds
  # "{$cmd} {$args} {$static_extension_str}"), so it would override the
  # `--enable-zts --disable-zend-signals` that spc emits for ZTS builds —
  # silently flipping Zend signals on in the SDK ephpm links. ffi is added
  # only to the NTS matrix entries, where no --disable-zend-signals is
  # emitted in the first place.
  PHP_EXTENSIONS: "bcmath,bz2,calendar,ctype,curl,dom,exif,fileinfo,filter,ftp,gd,gettext,gmp,hash,iconv,intl,mbregex,mbstring,mysqli,mysqlnd,opcache,openssl,pcntl,pcre,pdo,pdo_mysql,pdo_pgsql,pdo_sqlite,pgsql,phar,posix,session,shmop,simplexml,soap,sockets,sodium,sqlite3,sysvmsg,sysvsem,sysvshm,tokenizer,xml,xmlreader,xmlwriter,xsl,zip,zlib"

# Supersede stale builds: a new dispatch for the same version+platform cancels
# an older still-queued/running one. Keyed on php_version AND platform so
# independent targets (e.g. 8.3.31 and 8.4.22, or macos vs linux) still build
# in parallel -- only a genuine re-dispatch of the SAME target is cancelled.
# This is what prevents an un-dispatched run from lingering "queued" forever
# (a self-hosted runner then loops provisioning a VM it can never satisfy).
concurrency:
  group: build-${{ github.ref }}-${{ inputs.php_version }}-${{ inputs.platform }}
  cancel-in-progress: true

jobs:
  # Compute which jobs / matrix entries actually run based on the `platform`
  # input. Each build job below reads from these outputs so we can target a
  # single OS/arch (or all of them) from one workflow_dispatch invocation.
  # Empty matrices => the job's matrix expands to zero runs and is skipped.
  setup:
    name: Setup (resolve target platforms)
    runs-on: ubuntu-latest
    outputs:
      linux-matrix: ${{ steps.compute.outputs.linux-matrix }}
      build-macos: ${{ steps.compute.outputs.build-macos }}
      build-windows: ${{ steps.compute.outputs.build-windows }}
      build-windows-clang: ${{ steps.compute.outputs.build-windows-clang }}
    steps:
      - id: compute
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          # Each Linux matrix entry picks a libc flavor via the container
          # image: Alpine's native gcc links against musl (static-friendly).
          # The gnu flavor builds on almalinux:8 (glibc 2.28) with GCC 13 from
          # gcc-toolset-13, so the resulting libphp.a carries a glibc symbol
          # floor of 2.28 instead of 24.04's 2.39 -- a modern GCC over an old
          # glibc, the manylinux model, on a Docker-format image the fleet can
          # run (the quay manylinux images are OCI indexes the fleet Docker
          # rejects). GCC 13 (not 14) because GCC 14 hard-errors on the
          # implicit strlcpy in PHP ext/openssl on glibc 2.28 (see the build
          # step). glibc forward-compat
          # means a 2.28-floored consumer binary runs on RHEL8/AlmaLinux8,
          # Ubuntu 20.04+, Debian 10+, Amazon Linux 2023, Fedora 40+.
          # "suffix" is appended to the tarball / artifact name ("" keeps the
          # legacy musl names). "zts" selects --enable-zts. "extra" is
          # appended verbatim to PHP_EXTENSIONS. "variant" is the docker
          # container name discriminator (must be unique per matrix entry
          # that can land on the same runner).
          #
          # ZTS IS THE UNSUFFIXED DEFAULT AND MUST STAY THAT WAY. ephpm's
          # xtask builds the asset name as
          # php-sdk-{version}-{os}-{arch}{suffix}.tar.gz literally and never
          # globs, and its SDK cache directory matches. Renaming an existing
          # tarball breaks ephpm at both download and cache resolution. New
          # flavors get a NEW suffix; existing names are never touched.
          #
          # The -nts entries are NOT in `all`, on purpose. build-linux is one
          # job with a matrix, and the release job gates on
          # needs.build-linux.result != 'failure' — so a failing NTS leg
          # inside `all` would take the whole release down with it. NTS is
          # dispatched explicitly (or by watch-php.yml, which dispatches it
          # as its own platform run) and can fail on its own.
          musl_x64='{"arch":"x86_64","libc":"musl","image":"docker.io/library/alpine:3.20","suffix":"","zts":"1","extra":"","variant":"musl","runner":["self-hosted","linux","x64"]}'
          musl_arm='{"arch":"aarch64","libc":"musl","image":"docker.io/library/alpine:3.20","suffix":"","zts":"1","extra":"","variant":"musl","runner":["self-hosted","linux","arm64"]}'
          gnu_x64='{"arch":"x86_64","libc":"gnu","image":"docker.io/library/almalinux:8","suffix":"-gnu","zts":"1","extra":"","variant":"gnu","runner":["self-hosted","linux","x64"]}'
          gnu_arm='{"arch":"aarch64","libc":"gnu","image":"docker.io/library/almalinux:8","suffix":"-gnu","zts":"1","extra":"","variant":"gnu","runner":["self-hosted","linux","arm64"]}'
          # NTS, glibc only. ffi rides along here rather than in the shared
          # PHP_EXTENSIONS because its --enable-zend-signals would override
          # the --disable-zend-signals spc emits for ZTS builds (see the
          # PHP_EXTENSIONS comment at the top of this file).
          nts_x64='{"arch":"x86_64","libc":"gnu","image":"docker.io/library/almalinux:8","suffix":"-gnu-nts","zts":"0","extra":",ffi","variant":"gnu-nts","runner":["self-hosted","linux","x64"]}'
          nts_arm='{"arch":"aarch64","libc":"gnu","image":"docker.io/library/almalinux:8","suffix":"-gnu-nts","zts":"0","extra":",ffi","variant":"gnu-nts","runner":["self-hosted","linux","arm64"]}'
          # Shared-embed NTS: same toolchain and extension set as -gnu-nts,
          # but SPC_CMD_VAR_PHP_EMBED_TYPE=shared (the "embed" field, read by
          # the container script) makes spc produce lib/libphp.so with all
          # dependencies statically linked inside, instead of lib/libphp.a
          # plus dependency archives. For consumers whose build systems only
          # detect a shared libphp (dlopen/-lphp), e.g. PAM.
          nts_sh_x64='{"arch":"x86_64","libc":"gnu","image":"docker.io/library/almalinux:8","suffix":"-gnu-nts-shared","zts":"0","extra":",ffi","variant":"gnu-nts-shared","embed":"shared","runner":["self-hosted","linux","x64"]}'
          nts_sh_arm='{"arch":"aarch64","libc":"gnu","image":"docker.io/library/almalinux:8","suffix":"-gnu-nts-shared","zts":"0","extra":",ffi","variant":"gnu-nts-shared","embed":"shared","runner":["self-hosted","linux","arm64"]}'
          case "$PLATFORM" in
            all)                    lm="[$musl_x64,$musl_arm,$gnu_x64,$gnu_arm]"; mac=true;  win=true ;;
            linux-x86_64)           lm="[$musl_x64]"; mac=false; win=false ;;
            linux-aarch64)          lm="[$musl_arm]"; mac=false; win=false ;;
            linux-x86_64-gnu)       lm="[$gnu_x64]";  mac=false; win=false ;;
            linux-aarch64-gnu)      lm="[$gnu_arm]";  mac=false; win=false ;;
            linux-x86_64-gnu-nts)   lm="[$nts_x64]";  mac=false; win=false ;;
            linux-aarch64-gnu-nts)  lm="[$nts_arm]";  mac=false; win=false ;;
            linux-x86_64-gnu-nts-shared)  lm="[$nts_sh_x64]"; mac=false; win=false ;;
            linux-aarch64-gnu-nts-shared) lm="[$nts_sh_arm]"; mac=false; win=false ;;
            macos-aarch64)          lm='[]';          mac=true;  win=false ;;
            windows-x86_64)         lm='[]';          mac=false; win=true ;;
            # Experimental clang-cl/TAILCALL lane. NOT in `all`, on purpose —
            # same isolation rationale as the -nts entries: it is dispatched
            # explicitly and can fail without taking a release down.
            windows-x86_64-clang)   lm='[]';          mac=false; win=false; winclang=true ;;
            *) echo "::error::unknown platform $PLATFORM"; exit 1 ;;
          esac
          echo "linux-matrix=$lm" >> "$GITHUB_OUTPUT"
          echo "build-macos=$mac" >> "$GITHUB_OUTPUT"
          echo "build-windows=$win" >> "$GITHUB_OUTPUT"
          echo "build-windows-clang=${winclang:-false}" >> "$GITHUB_OUTPUT"

  build-linux:
    name: Linux (${{ matrix.arch }}, ${{ matrix.variant }})
    needs: setup
    if: needs.setup.outputs.linux-matrix != '[]'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.linux-matrix) }}
    steps:
      # Checked out into a subdirectory on purpose: actions/checkout only
      # manages the path it is given, so spc's caches and this job's own
      # output/ and sdk/ directories in the workspace root are untouched.
      # Only tools/mk-sdk-metadata.sh and embed/ are used from it, in
      # Package SDK.
      - name: Checkout build tools
        uses: actions/checkout@v4
        with:
          path: sdk-tools

      - name: Clean up previous builds
        run: |
          rm -rf output sdk *.tar.gz
          docker rm -f "spc-build-${{ matrix.variant }}" 2>/dev/null || true

      - name: Build inside container (${{ matrix.libc }})
        # The container image decides the libc flavor: alpine (musl, the
        # legacy fully-static SDK) or ubuntu (glibc, the "gnu" SDK that
        # ephpm's dynamic Linux binaries link so PHP can dlopen shared
        # extensions at runtime). Same spc invocation either way.
        run: |
          docker run --name "spc-build-${{ matrix.variant }}" \
            -e GITHUB_TOKEN="${GITHUB_TOKEN}" \
            -e SPC_VERSION="${{ env.SPC_VERSION }}" \
            -e PHP_VERSION="${{ inputs.php_version }}" \
            -e PHP_EXTENSIONS="${{ env.PHP_EXTENSIONS }}${{ matrix.extra }}" \
            -e LIBC="${{ matrix.libc }}" \
            -e ENABLE_ZTS="${{ matrix.zts }}" \
            -e EMBED_TYPE="${{ matrix.embed }}" \
            -e SPC_OPCACHE_EXTRA_SAPIS="${{ env.SPC_OPCACHE_EXTRA_SAPIS }}" \
            "${{ matrix.image }}" sh -c '
              set -eux

              if [ "$LIBC" = "gnu" ]; then
                # almalinux:8 = glibc 2.28, a Docker-format image the fleet can
                # run (the quay manylinux images are OCI indexes the fleet
                # Docker refuses even with --platform). Use gcc-toolset-13, NOT
                # 14: GCC 14 promotes -Wimplicit-function-declaration to a hard
                # ERROR, and PHP ext/openssl on glibc 2.28 calls strlcpy (added
                # to glibc only in 2.38) without an in-scope prototype -- PHP
                # bundles its own strlcpy symbol so it LINKS, but GCC 14 fails
                # at COMPILE. GCC 13 keeps it a warning, so it builds and links
                # against PHP built-in strlcpy. re2c is EPEL/PowerTools on
                # AlmaLinux 8 (not preinstalled); enable both, keep re2c
                # non-fatal, and let spc doctor --auto-fix build it if absent.
                dnf install -y dnf-plugins-core epel-release
                dnf config-manager --set-enabled powertools 2>/dev/null \
                  || dnf config-manager --set-enabled crb 2>/dev/null || true
                dnf install -y --allowerasing \
                  bash ca-certificates curl git gcc-toolset-13 autoconf \
                  automake bison cmake flex libtool make pkgconfig \
                  tar xz which
                dnf install -y re2c || echo "re2c not packaged; spc doctor will build it"
                . /opt/rh/gcc-toolset-13/enable
              else
                apk add --no-cache \
                  bash curl git build-base autoconf automake bison cmake flex \
                  libtool make pkgconf re2c linux-headers tar xz
              fi

              # Use native gcc instead of zig-cc. Native gcc links against
              # the image libc: musl on Alpine, glibc 2.28 on almalinux:8.
              export SPC_TOOLCHAIN="StaticPHP\\Toolchain\\GccNativeToolchain"
              # CRITICAL for gnu builds: the spc env.ini defaults SPC_TARGET to
              # <arch>-linux-musl on Linux, and its libc self-check then aborts
              # with "linking against musl libc dynamically, but musl libc is
              # not installed" even though the toolchain is native gcc. Real
              # env vars win over env.ini, so set the target per libc flavor.
              if [ "$LIBC" = "gnu" ]; then
                export SPC_TARGET="$(uname -m)-linux-gnu"
              fi

              # Hardware-intrinsics fix: the spc fork env.ini puts
              # -fvisibility-inlines-hidden (a C++-only flag) into
              # PHP_MAKE_EXTRA_CFLAGS. GCC warns on every C compile, and
              # php-src AX_GCC_FUNC_ATTRIBUTE treats ANY stderr as
              # "attribute unsupported", so HAVE_FUNC_ATTRIBUTE_TARGET/IFUNC
              # end up undefined and PHP silently skips ALL x86 intrinsic
              # resolvers: SHA-NI sha256 (measured 2.7x slower than it
              # should be), PCLMUL crc32c (2.2x), and every ZEND_INTRIN_*
              # path (SSSE3/AVX2 base64 etc.). Upstream spc fixed the flag
              # placement in May 2026; until the fork rebases onto that,
              # override here -- env vars win over env.ini. Value = the fork
              # env.ini line with the one C++-only token removed and
              # ${SPC_DEFAULT_CFLAGS} pre-expanded (env-provided values skip
              # the ini ${} interpolation, so it must be spelled out).
              export SPC_CMD_VAR_PHP_MAKE_EXTRA_CFLAGS="-g -fstack-protector-strong -fno-ident -fPIE -fvisibility=hidden -fPIC -O3 -pipe -fno-plt -fno-semantic-interposition -fstack-clash-protection -fno-omit-frame-pointer -mno-omit-leaf-frame-pointer -ffunction-sections -fdata-sections -Wno-unused-command-line-argument"

              # Extract spc into a fresh temp dir and PATH it: on the ubuntu
              # image the runner storage/userns combo denied writes into
              # /usr/local/bin during extraction (run 28759904638) even though
              # the identical step passes on alpine. A fresh /tmp dir is
              # writable under any uid mapping. Debug line kept on purpose.
              id && ls -ld /usr/local/bin || true
              mkdir -p /tmp/spcbin
              curl -fsSL "https://github.com/luthermonson/static-php-cli/releases/download/${SPC_VERSION}/spc-linux-$(uname -m).tar.gz" \
                | tar xz --no-same-owner --no-same-permissions -C /tmp/spcbin
              chmod +x /tmp/spcbin/spc
              export PATH="/tmp/spcbin:${PATH}"

              mkdir /build && cd /build
              # Retry spc download to tolerate transient upstream flakes
              # (pecl.php.net, GitHub API rate limits). Up to 8 attempts with
              # exponential backoff capped at 300s, about 10 minutes total.
              # It used to be 6 attempts with 2-3s jitter, roughly 40 seconds
              # of tolerance, which is nothing against an outage measured in
              # hours: every scheduled build from 2026-08-06 onward burned
              # through all 6 attempts in under a minute and failed.
              # php-src comes from our own GitHub mirror (release tag
              # "php-sources"): fleet egress to php.net is
              # unreliable (release-info API refused every attempt on
              # 2026-07-06 while GitHub worked throughout), and pinned
              # tarballs also make builds deterministic. Pre-fetch with plain
              # curl (the same mechanism that fetches spc itself, proven on
              # the fleet) and hand spc a file:// URL — the spc internal HTTP client
              # failed on the release-asset redirect from the runner (curl
              # exit 22, run 28761831602) while plain curl succeeds. Refresh
              # the mirror when bumping pinned PHP versions.
              j=0
              until curl -fsSL -o /tmp/php-src-mirror.tar.gz \
                  "https://github.com/ephpm/php-sdk/releases/download/php-sources/php-${PHP_VERSION}.tar.gz"; do
                j=$((j + 1))
                if [ "$j" -ge 5 ]; then
                  echo "mirror fetch failed after $j attempts" >&2
                  exit 1
                fi
                sleep 3
              done

              # GNU dependency mirror. Six artifacts in our extension set
              # resolve through spc filelist sources pointed at
              # ftpmirror.gnu.org, which round-robins to volunteer backend
              # mirrors and returns an HTTP error when it picks a bad one.
              # Five of the six (libiconv, gettext, ncurses, libunistring,
              # idn2) have NO source-mirror fallback in spc, so one bad
              # backend fails the whole download and therefore the build.
              # That killed every scheduled build from 2026-08-06 onward.
              # Fetch them from our own release tag instead, exactly as
              # php-src already is, and hand spc file:// custom-urls.
              # Populated by mirror-deps.yml.
              #
              # If the manifest is absent the mirror has not been populated
              # yet: warn loudly and let spc fetch upstream, which is the
              # pre-mirror behavior. Failing here instead would turn a
              # missing mirror into a broken build, which is the opposite of
              # the point.
              CUSTOM_URLS=""
              mkdir -p /tmp/deps
              if curl -fsSL -o /tmp/deps/manifest.txt \
                  "https://github.com/ephpm/php-sdk/releases/download/php-sources/gnu-deps-manifest.txt"; then
                while read -r dep_name dep_file; do
                  if [ -z "${dep_name}" ] || [ -z "${dep_file}" ]; then
                    continue
                  fi
                  if curl -fsSL -o "/tmp/deps/${dep_file}" \
                      "https://github.com/ephpm/php-sdk/releases/download/php-sources/${dep_file}"; then
                    CUSTOM_URLS="${CUSTOM_URLS} --custom-url=${dep_name}:file:///tmp/deps/${dep_file}"
                    echo "==> mirrored ${dep_name} as ${dep_file}"
                  else
                    echo "::warning::manifest lists ${dep_file} but it did not download; letting spc fetch ${dep_name} upstream"
                  fi
                done < /tmp/deps/manifest.txt
              else
                echo "::warning::no gnu-deps-manifest.txt on the php-sources release tag - falling back to upstream GNU mirrors, which are the known failure mode. Run mirror-deps.yml to populate it."
              fi

              i=0
              until spc download \
                  --with-php=${PHP_VERSION} \
                  --for-extensions=${PHP_EXTENSIONS} \
                  --custom-url="php-src:file:///tmp/php-src-mirror.tar.gz" \
                  ${CUSTOM_URLS} \
                  --prefer-pre-built; do
                i=$((i + 1))
                if [ "$i" -ge 8 ]; then
                  echo "spc download failed after $i attempts" >&2
                  exit 1
                fi
                s=$(awk "BEGIN{srand(); b=5*(2^($i-1)); if(b>300)b=300; print int(b)+int(rand()*5)}")
                echo "spc download flaked (attempt $i), retrying in ${s}s..."
                sleep "$s"
              done

              spc doctor --auto-fix || true

              # --dl-with-php pins the build-phase artifact downloader to the
              # requested version. Without it, spc build re-checks php-src
              # against the dl-with-php DEFAULT (8.5), treats the cached
              # 8.4.x/8.3.x source as a mismatch, silently re-downloads
              # latest 8.5.x, and builds the wrong PHP (shipped mislabeled
              # tarballs until the version guard below caught it).
              # NOTE: this comment lives inside a single-quoted sh -c
              # block; apostrophes here would terminate the string.
              #
              # ENABLE_ZTS=0 drops --enable-zts, which is what makes the
              # -gnu-nts tarball non-thread-safe. spc gates cleanly on the
              # flag: src/Package/Target/php/unix.php only emits
              # --enable-zts --disable-zend-signals (and
              # --enable-zend-max-execution-timers) when the build option is
              # set, so an NTS run gets stock PHP defaults instead.
              ZTS_FLAG=""
              if [ "$ENABLE_ZTS" = "1" ]; then
                ZTS_FLAG="--enable-zts"
              fi

              # static (default) -> lib/libphp.a + dependency archives;
              # shared -> lib/libphp.so with dependencies linked in
              # (rc18 src/Package/Target/php/unix.php branches on this).
              export SPC_CMD_VAR_PHP_EMBED_TYPE="${EMBED_TYPE:-static}"

              spc build ${PHP_EXTENSIONS} \
                --dl-with-php=${PHP_VERSION} \
                --build-embed \
                ${ZTS_FLAG} \
                --no-strip \
                --debug

              # Stage artifacts inside the container before it stops.
              # spc nests install output under buildroot/lib at varying
              # depths (lib/lib/, sometimes deeper). Find .a files and the
              # php header dir wherever they landed and copy them into a
              # flat layout. cp -L dereferences symlinks
              # (e.g. libcurses.a → libncurses.a).
              mkdir -p /output/lib /output/include
              if [ "$SPC_CMD_VAR_PHP_EMBED_TYPE" = "shared" ]; then
                # The shared embed installs a versioned libphp-<ver>.so plus
                # a libphp.so symlink; copy both preserving the link (-P via
                # cp -a on the find results). Dependency archives stay out --
                # they are already linked into the .so.
                find /build/buildroot/lib -name "libphp*.so*" -exec cp -a {} /output/lib/ \;
                if [ ! -e /output/lib/libphp.so ]; then
                  echo "ERROR: shared embed build produced no libphp.so under buildroot/lib" >&2
                  exit 1
                fi
              else
                find /build/buildroot/lib -name "*.a" -type f -exec cp -Lf {} /output/lib/ \;
              fi
              PHP_INC_DIR=$(find /build/buildroot/include -name php -type d | head -n 1)
              if [ -z "$PHP_INC_DIR" ]; then
                echo "ERROR: no php header dir found under buildroot/include" >&2
                exit 1
              fi
              cp -RLf "$PHP_INC_DIR" /output/include/php

              # Guard: the thread-safety of what we built must match the
              # matrix entry, because the tarball SUFFIX is what tells
              # consumers apart and nothing downstream re-checks. A ZTS
              # tarball published under -gnu-nts (or the reverse) would fail
              # at dlopen or link time in the consumer, far from here.
              # php_config.h defines ZTS to 1 only for thread-safe builds.
              if [ "$ENABLE_ZTS" = "1" ]; then
                grep -q "define ZTS 1" /output/include/php/main/php_config.h
                echo "==> ZTS guard passed: thread-safe build as expected"
              else
                if grep -q "define ZTS 1" /output/include/php/main/php_config.h; then
                  echo "::error::asked for a non-thread-safe build but php_config.h defines ZTS 1" >&2
                  exit 1
                fi
                echo "==> ZTS guard passed: non-thread-safe build as expected"
              fi

              # Guard: prove the CFLAGS override above actually re-enabled
              # the hardware intrinsics. Every Linux SDK before 2026-07
              # shipped with HAVE_FUNC_ATTRIBUTE_TARGET silently undefined
              # (no SHA-NI sha256, no PCLMUL crc32, no AVX2 base64) and no
              # check caught it. x86_64 only: PHP ext/hash has no aarch64
              # equivalent intrinsics.
              if [ "$(uname -m)" = "x86_64" ]; then
                grep -q "define HAVE_FUNC_ATTRIBUTE_TARGET 1" /output/include/php/main/php_config.h
                if [ "$SPC_CMD_VAR_PHP_EMBED_TYPE" = "shared" ]; then
                  # --no-strip keeps the full symtab, so nm sees the
                  # static-scope transform in the .so as well.
                  nm /output/lib/libphp.so | grep -q "SHA256_Transform_shani"
                  echo "==> intrinsics guard passed: SHA-NI transform present in libphp.so"
                else
                  nm /output/lib/libphp.a | grep -q "SHA256_Transform_shani"
                  echo "==> intrinsics guard passed: SHA-NI transform present in libphp.a"
                fi
              fi

              # Bundle the container libstdc++.a (musl-flavored on Alpine,
              # glibc-flavored on Ubuntu) so downstream consumers link
              # against the same C++ runtime spc used to compile libicu*,
              # libxml2, etc. PHPs intl extension references C++ symbols
              # (std::__throw_bad_alloc, __cxa_begin_catch, ICU
              # UnicodeString ctors, ...). Mixing libstdc++ flavors across
              # libc boundaries makes downstream binaries either fail to
              # link or silently mismix C++ runtimes.
              libstdcxx_path=$(c++ -print-file-name=libstdc++.a)
              if [ -f "$libstdcxx_path" ]; then
                cp "$libstdcxx_path" /output/lib/
                echo "==> Staged libstdc++.a from $libstdcxx_path"
              else
                echo "::error::libstdc++.a not found (c++ -print-file-name returned: $libstdcxx_path)"
                exit 1
              fi

            '

          # Copy staged artifacts out of the stopped container.
          # `docker cp container:/output ./` copies /output as ./output (src
          # dir → dest as src-named subdir). Avoid the `/.` "copy contents"
          # form — observed to leave the source dir nested inside the
          # destination on some runner Docker versions, producing
          # ./lib/lib/*.a in the final tarball.
          docker cp "spc-build-${{ matrix.variant }}:/output" ./
          docker rm "spc-build-${{ matrix.variant }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package SDK
        run: |
          mkdir -p sdk
          cp -r output/* sdk/

          # Guard: the staged headers must be the PHP version this run was
          # asked to build. spc has silently fallen back to "latest stable"
          # before (--with-php=8.4.21 produced a PHP 8.5.7 tree, shipped as
          # v8.4.21, and was only caught days later by ephpm's E2E version
          # assertion). Fail here, loudly, instead of publishing a
          # mislabeled SDK.
          staged=$(sed -n 's/^#define PHP_VERSION "\(.*\)"/\1/p' sdk/include/php/main/php_version.h)
          if [ "$staged" != "${{ inputs.php_version }}" ]; then
            echo "::error::staged PHP is '${staged}' but this build was asked for '${{ inputs.php_version }}' - spc ignored --with-php"
            exit 1
          fi
          echo "==> Version guard OK: staged PHP ${staged}"

          # Adds bin/php-config (relocatable shim) and THIRD-PARTY-NOTICES.txt
          # to the staged tree. The script self-checks the shim before
          # returning, so a broken shim fails the build here rather than in a
          # consumer.
          sh sdk-tools/tools/mk-sdk-metadata.sh sdk linux

          # NTS tarballs ship embed/resolver_shim.c + EMBEDDING.md: libphp.a
          # is built against glibc 2.28 and references unversioned
          # __dn_expand/__res_nsearch/__dn_skipname, which glibc >= 2.34
          # (Ubuntu 22.04+) no longer exports -- embedders must compile the
          # shim into their build or the link fails. EMBEDDING.md documents
          # this and the shared-variant usage.
          case "${{ matrix.suffix }}" in
            *-nts*)
              mkdir -p sdk/embed
              cp sdk-tools/embed/resolver_shim.c sdk/embed/
              cp sdk-tools/embed/EMBEDDING.md sdk/EMBEDDING.md
              ;;
          esac

          tar czf php-sdk-${{ inputs.php_version }}-linux-${{ matrix.arch }}${{ matrix.suffix }}.tar.gz -C sdk .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-sdk-${{ inputs.php_version }}-linux-${{ matrix.arch }}${{ matrix.suffix }}
          path: php-sdk-${{ inputs.php_version }}-linux-${{ matrix.arch }}${{ matrix.suffix }}.tar.gz

  build-macos:
    name: macOS (${{ matrix.arch }})
    needs: setup
    if: needs.setup.outputs.build-macos == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: [self-hosted, macos, arm64]
            spc_arch: aarch64
    steps:
      # Subdirectory checkout so spc's downloads/ and buildroot/ caches in
      # the workspace root are untouched (see build-linux).
      - name: Checkout build tools
        uses: actions/checkout@v4
        with:
          path: sdk-tools

      # spc on macOS is a self-contained micro-PHP binary (same as Windows
      # spc.exe), so no host PHP install is needed. The runner image is bare,
      # so we let `spc doctor --auto-fix` install Homebrew and the build deps
      # it lists in MacOSToolCheckList::REQUIRED_COMMANDS (autoconf, automake,
      # bison, cmake, flex, libtool, make, pkg-config, re2c, etc.).
      - name: Download spc
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL "https://github.com/luthermonson/static-php-cli/releases/download/${{ env.SPC_VERSION }}/spc-macos-${{ matrix.spc_arch }}.tar.gz" \
            | tar xz -C "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          # Pre-add Homebrew to PATH so spc doctor can use brew immediately
          # after installing it (spc doesn't update PATH itself).
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Install Homebrew + build deps via spc doctor
        # NONINTERACTIVE=1 is required so the Homebrew installer doesn't prompt
        # for sudo confirmation (which would hang in CI).
        # Retried: doctor downloads tool artifacts (pkg-config etc.) and a
        # transient fetch failure otherwise kills the whole build in the
        # first seconds (run 28918698346).
        env:
          NONINTERACTIVE: "1"
        run: |
          i=0
          until spc doctor --auto-fix; do
            i=$((i + 1))
            if [ "$i" -ge 5 ]; then
              echo "spc doctor failed after $i attempts" >&2
              exit 1
            fi
            s=$((RANDOM % 4 + 3))
            echo "spc doctor flaked (attempt $i), retrying in ${s}s..."
            sleep "$s"
          done

      # Apple clang crashes on PHP's JIT code (zend_jit_vm_helpers.c, exit 70),
      # so use Homebrew LLVM instead. Doctor's REQUIRED_COMMANDS doesn't
      # include llvm, so we install it explicitly after brew is up.
      - name: Install LLVM and prepend to PATH
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Download PHP sources
        # Retry to tolerate transient upstream flakes (see linux build).
        # The macOS runner hits the same GNU mirror failures as the Linux
        # fleet — run 31069330534 died here on libiconv — so it consumes the
        # same dependency mirror. See the linux build for the full rationale.
        run: |
          CUSTOM_URLS=""
          mkdir -p /tmp/deps
          if curl -fsSL -o /tmp/deps/manifest.txt \
              "https://github.com/ephpm/php-sdk/releases/download/php-sources/gnu-deps-manifest.txt"; then
            while read -r dep_name dep_file; do
              if [ -z "${dep_name}" ] || [ -z "${dep_file}" ]; then
                continue
              fi
              if curl -fsSL -o "/tmp/deps/${dep_file}" \
                  "https://github.com/ephpm/php-sdk/releases/download/php-sources/${dep_file}"; then
                CUSTOM_URLS="${CUSTOM_URLS} --custom-url=${dep_name}:file:///tmp/deps/${dep_file}"
                echo "==> mirrored ${dep_name} as ${dep_file}"
              else
                echo "::warning::manifest lists ${dep_file} but it did not download; letting spc fetch ${dep_name} upstream"
              fi
            done < /tmp/deps/manifest.txt
          else
            echo "::warning::no gnu-deps-manifest.txt on the php-sources release tag - falling back to upstream GNU mirrors, which are the known failure mode. Run mirror-deps.yml to populate it."
          fi

          i=0
          # shellcheck disable=SC2086 # CUSTOM_URLS must word-split into one
          # --custom-url= argument per mirrored dependency; quoting it would
          # pass the whole list as a single argument.
          until spc download \
              --with-php=${{ inputs.php_version }} \
              --for-extensions=${{ env.PHP_EXTENSIONS }} \
              ${CUSTOM_URLS} \
              --prefer-pre-built; do
            i=$((i + 1))
            if [ "$i" -ge 8 ]; then
              echo "spc download failed after $i attempts" >&2
              exit 1
            fi
            s=$(awk "BEGIN{srand(); b=5*(2^($i-1)); if(b>300)b=300; print int(b)+int(rand()*5)}")
            echo "spc download flaked (attempt $i), retrying in ${s}s..."
            sleep "$s"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build libphp.a
        run: |
          # PHP < 8.4 uses K&R function declarations removed in C23.
          # Homebrew LLVM/clang defaults to -std=gnu23, so force gnu17.
          php_minor=$(echo "${{ inputs.php_version }}" | cut -d. -f2)
          if [ "$php_minor" -lt 4 ]; then
            export CFLAGS="-std=gnu17"
          fi
          # --dl-with-php pins the build-phase downloader to the requested
          # version (see linux build for the incident this prevents).
          spc build ${{ env.PHP_EXTENSIONS }} \
            --dl-with-php=${{ inputs.php_version }} \
            --build-embed \
            --enable-zts \
            --no-strip \
            --debug

      - name: Package SDK
        run: |
          mkdir -p sdk/lib sdk/include
          # spc nests install output at varying depths; discover by find
          # (see linux build for rationale).
          find buildroot/lib -name "*.a" -type f -exec cp -Lf {} sdk/lib/ \;
          PHP_INC_DIR=$(find buildroot/include -name php -type d | head -n 1)
          if [ -z "$PHP_INC_DIR" ]; then
            echo "ERROR: no php header dir found under buildroot/include" >&2
            exit 1
          fi
          cp -RLf "$PHP_INC_DIR" sdk/include/php

          # Guard: staged headers must match the requested version (see the
          # linux Package SDK step for the incident this prevents).
          staged=$(sed -n 's/^#define PHP_VERSION "\(.*\)"/\1/p' sdk/include/php/main/php_version.h)
          if [ "$staged" != "${{ inputs.php_version }}" ]; then
            echo "::error::staged PHP is '${staged}' but this build was asked for '${{ inputs.php_version }}' - spc ignored --with-php"
            exit 1
          fi
          echo "==> Version guard OK: staged PHP ${staged}"

          # bin/php-config + THIRD-PARTY-NOTICES.txt (see the linux job).
          # The macos flavor emits no --start-group in --libs: ld64 rejects it.
          sh sdk-tools/tools/mk-sdk-metadata.sh sdk macos

          tar czf php-sdk-${{ inputs.php_version }}-macos-${{ matrix.arch }}.tar.gz -C sdk .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-sdk-${{ inputs.php_version }}-macos-${{ matrix.arch }}
          path: php-sdk-${{ inputs.php_version }}-macos-${{ matrix.arch }}.tar.gz

  build-windows:
    name: Windows (x86_64)
    needs: setup
    if: needs.setup.outputs.build-windows == 'true'
    runs-on: [self-hosted, windows, x64]
    # Windows-specific extension set: PHP_EXTENSIONS minus the Unix-only
    # entries (pcntl, posix, sysvmsg, sysvsem, sysvshm) and any extension
    # that won't build under static-php-cli's current Windows toolchain:
    #   - gmp → no static-libs@windows in v3 gmp.yml
    #   - pgsql, pdo_pgsql → spc uses pre-built EnterpriseDB import lib
    #     (links against LIBPQ.DLL) instead of a static build
    # Re-add as spc grows Windows support for its underlying library.
    env:
      WIN_PHP_EXTENSIONS: "bcmath,bz2,calendar,ctype,curl,dom,exif,fileinfo,filter,ftp,gd,gettext,hash,iconv,intl,mbregex,mbstring,mysqli,mysqlnd,opcache,openssl,pcre,pdo,pdo_mysql,pdo_sqlite,phar,session,simplexml,soap,sodium,sqlite3,tokenizer,xml,xmlreader,xmlwriter,xsl,zip,zlib"
    steps:
      - name: Clean up previous builds
        shell: powershell
        run: |
          foreach ($dir in @('buildroot', 'source', 'downloads', 'sdk', 'php-sdk-binary-tools')) {
            if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
          }
          Remove-Item -Force *.tar.gz -ErrorAction SilentlyContinue

      - name: Install Git for Windows
        shell: powershell
        # Server Core has no git. spc needs:
        # - git.exe: doctor's install-php-sdk auto-fix clones php-sdk-binary-tools
        # - usr\bin\patch.exe: source patching during build
        # Use PortableGit (self-extracting 7z) installed at the standard Git
        # for Windows path so spc's expected layout matches.
        run: |
          $gitRoot = "C:\Program Files\Git"
          if (-not (Test-Path "$gitRoot\cmd\git.exe")) {
            $ver = "2.49.0"
            $url = "https://github.com/git-for-windows/git/releases/download/v${ver}.windows.1/PortableGit-${ver}-64-bit.7z.exe"
            Write-Host "Downloading PortableGit $ver..."
            Invoke-WebRequest -Uri $url -OutFile portable-git.7z.exe
            Write-Host "Extracting to $gitRoot..."
            Start-Process -FilePath .\portable-git.7z.exe `
              -ArgumentList @("-o`"$gitRoot`"", '-y') -Wait -NoNewWindow
            Remove-Item portable-git.7z.exe
            if (-not (Test-Path "$gitRoot\cmd\git.exe")) {
              Write-Error "PortableGit extraction failed: $gitRoot\cmd\git.exe not found"
              exit 1
            }
          }
          "$gitRoot\cmd" | Out-File -Append -FilePath $env:GITHUB_PATH
          "$gitRoot\usr\bin" | Out-File -Append -FilePath $env:GITHUB_PATH

      # After the Git install so tools/mk-sdk-metadata.sh has a bash to run
      # under in Package SDK. Subdirectory checkout: the workspace root holds
      # spc's buildroot/source/downloads and must not be touched.
      - name: Checkout build tools
        uses: actions/checkout@v4
        with:
          path: sdk-tools

      - name: Install Visual Studio Build Tools
        shell: powershell
        # PHP requires MSVC to compile on Windows. Runner image is
        # mcr.microsoft.com/windows/servercore:ltsc2025 with no compiler.
        # Install Build Tools per-job (~10-15 min). Long-term: dedicated
        # php-sdk runner image with VS pre-baked.
        #
        # Install path: C:\BuildTools (Microsoft's recommended path for
        # Server Core containers; nested Program Files paths are flaky).
        # spc's findVisualStudio() probes Community/Professional/Enterprise
        # under standard Program Files locations, so we junction one of
        # those to C:\BuildTools after install.
        #
        # The bootstrapper (vs_buildtools.exe) exits before the underlying
        # installer engine actually finishes on Server Core, so we poll
        # for MSBuild.exe rather than trusting its exit code.
        run: |
          $installPath = "C:\BuildTools"
          $msbuild = "$installPath\MSBuild\Current\Bin\MSBuild.exe"
          $communityPath = "C:\Program Files\Microsoft Visual Studio\2022\Community"

          if (-not (Test-Path $msbuild)) {
            Write-Host "Downloading VS Build Tools bootstrapper..."
            Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vs_buildtools.exe" -OutFile vs_buildtools.exe

            Write-Host "Launching install (bootstrapper may exit before install completes)..."
            $proc = Start-Process -FilePath .\vs_buildtools.exe `
              -ArgumentList @(
                '--quiet', '--wait', '--norestart', '--nocache',
                '--installPath', $installPath,
                '--add', 'Microsoft.VisualStudio.Workload.VCTools',
                '--includeRecommended'
              ) -Wait -PassThru -NoNewWindow
            Write-Host "Bootstrapper exit code: $($proc.ExitCode)"
            Remove-Item vs_buildtools.exe

            # Poll for MSBuild.exe; bootstrapper exit is unreliable on Server Core
            $sw = [System.Diagnostics.Stopwatch]::StartNew()
            $timeoutMin = 20
            while (-not (Test-Path $msbuild) -and $sw.Elapsed.TotalMinutes -lt $timeoutMin) {
              Start-Sleep -Seconds 30
              Write-Host ("  ...waiting for VS install ({0:F0}s)" -f $sw.Elapsed.TotalSeconds)
            }

            if (-not (Test-Path $msbuild)) {
              Write-Host "::error::VS install timed out after $timeoutMin min - $msbuild never appeared"
              Write-Host "==> Searching for MSBuild.exe anywhere on disk:"
              Get-ChildItem -Path C:\ -Recurse -Filter MSBuild.exe -ErrorAction SilentlyContinue |
                Select-Object -First 10 |
                ForEach-Object { Write-Host "  $($_.FullName)" }
              Write-Host "==> Recent VS install logs in `$env:TEMP (dd_*.log):"
              Get-ChildItem -Path $env:TEMP -Filter 'dd_*.log' -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 5 |
                ForEach-Object {
                  Write-Host ('--- ' + $_.Name + ' ---')
                  Get-Content $_.FullName -Tail 80
                }
              exit 1
            }
            Write-Host ("MSBuild.exe found after {0:F0}s" -f $sw.Elapsed.TotalSeconds)
          } else {
            Write-Host "VS Build Tools already present at $installPath"
          }

          # Junction the path spc's hardcoded check expects -> our install path
          if (-not (Test-Path $communityPath)) {
            $parent = Split-Path $communityPath -Parent
            if (-not (Test-Path $parent)) {
              New-Item -ItemType Directory -Path $parent -Force | Out-Null
            }
            New-Item -ItemType Junction -Path $communityPath -Target $installPath | Out-Null
            Write-Host "Junction $communityPath -> $installPath"
          }

      - name: Download spc
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/luthermonson/static-php-cli/releases/download/${{ env.SPC_VERSION }}/spc-windows-x64.exe" -OutFile spc.exe
          "$PWD" | Out-File -Append -FilePath $env:GITHUB_PATH

      - name: Download PHP sources
        shell: powershell
        # This leg used to fail on "Failed to get GitHub release API info for
        # <repo>" -- a truncated-capture race in spc's Shell::passthru() on
        # Windows (non-blocking socket drain stopped before the tail of large
        # API responses arrived; curl itself exited 0). Root-caused via a -vv
        # run (31280535015), fixed upstream in the spc fork (issue #3 there,
        # drain to real EOF), shipped in v3.0.0-pgo-rc18.
        #
        # Note this was never the GNU-mirror problem the Linux/macOS legs work
        # around: none of the mirrored tarballs (gettext, idn2, libiconv,
        # libunistring, ncurses) are in the Windows artifact set, which uses
        # gettext-win/libiconv-win from git. So no CUSTOM_URLS block here.
        #
        # The 50-attempt budget was sized for the rc17 race (~2-5 attempts per
        # large artifact, cleared on attempt 4 of 50 in 31281980458). rc18
        # ships the upstream fix, after which this loop should be a formality
        # -- but the rc18 Windows leg has not run yet (the Windows runner
        # fleet was down when rc18 landed), so the budget stays at 50 until a
        # green Windows run on rc18 proves the fix in practice. Then it can
        # shrink to ~3. If a run burns many attempts on rc18+, the upstream
        # fix has regressed: check the -vv output of the final attempt, which
        # logs the curl exit code spc otherwise discards.
        #
        # --retry 3 gives the artifact downloads curl-level retries (spc's
        # default is 0, single-shot).
        run: |
          $max = 50
          for ($i = 1; $i -le $max; $i++) {
            # Array + splat, not a backtick-continued line: appending a $null
            # arg to a native command in PowerShell 5.1 passes an empty string
            # rather than dropping it, and Symfony Console rejects that.
            $spcArgs = @(
              'download',
              '--with-php=${{ inputs.php_version }}',
              '--for-extensions=${{ env.WIN_PHP_EXTENSIONS }}',
              '--retry=3',
              '--prefer-pre-built'
            )
            if ($i -eq $max) { $spcArgs += '-vv' }
            spc @spcArgs
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq $max) {
              Write-Error "spc download failed after $max attempts"
              exit 1
            }
            $s = Get-Random -Minimum 3 -Maximum 7
            Write-Host "spc download flaked (attempt $i), retrying in ${s}s..."
            Start-Sleep -Seconds $s
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run spc doctor
        shell: powershell
        # --auto-fix runs install-php-sdk (clones php-sdk-binary-tools, needed
        # for 7za.exe at extraction time), install-nasm, install-perl.
        run: |
          spc doctor --auto-fix
          exit 0

      - name: Add Strawberry Perl to PATH
        shell: powershell
        # spc doctor installs Strawberry Perl into pkgroot but doesn't
        # persist it in GITHUB_PATH. Git's perl is on PATH first and is
        # missing modules openssl needs (Locale::Maketext::Simple).
        # Prepend Strawberry Perl so it wins over Git's perl.
        run: |
          Write-Host "Searching for Strawberry Perl in: $PWD"
          Get-ChildItem -Directory -Recurse -Filter "strawberry-perl*" -ErrorAction SilentlyContinue |
            Select-Object -First 5 | ForEach-Object { Write-Host "  Found dir: $($_.FullName)" }
          $perlExe = Get-ChildItem -Recurse -Filter "perl.exe" -Path pkgroot -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "strawberry" } |
            Select-Object -First 1
          if ($perlExe) {
            $perlBin = $perlExe.DirectoryName
            Write-Host "Adding Strawberry Perl to PATH: $perlBin"
            $perlBin | Out-File -Append -FilePath $env:GITHUB_PATH
          } else {
            Write-Host "::warning::Strawberry Perl not found in pkgroot - falling back to system perl"
          }

      - name: Build php8embed (patched spc with embed SAPI support)
        shell: powershell
        run: |
          # Ensure Strawberry Perl precedes Git's perl in PATH for this step
          $spDir = Get-ChildItem -Directory pkgroot -Recurse -Filter "strawberry-perl*" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($spDir -and (Test-Path "$($spDir.FullName)\perl\bin\perl.exe")) {
            $env:PATH = "$($spDir.FullName)\perl\bin;$env:PATH"
            Write-Host "Strawberry Perl active: $(& perl.exe -v 2>&1 | Select-String 'MSWin32|version')"
          }
          # --dl-with-php pins the build-phase downloader to the requested
          # version (see linux build for the incident this prevents).
          spc build ${{ env.WIN_PHP_EXTENSIONS }} `
            --dl-with-php=${{ inputs.php_version }} `
            --build-embed `
            --enable-zts `
            --no-strip `
            --debug

      - name: Find build outputs
        shell: powershell
        run: |
          Write-Host "==> Searching for php8embed files..."
          Get-ChildItem -Recurse -Filter "php8embed.*" | ForEach-Object { Write-Host $_.FullName }
          Write-Host "==> Searching for php8ts files..."
          Get-ChildItem -Recurse -Filter "php8ts.*" | ForEach-Object { Write-Host $_.FullName }
          Write-Host "==> Searching for libphp files..."
          Get-ChildItem -Recurse -Filter "libphp.*" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }

      - name: Package SDK
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path sdk/lib, sdk/include

          # Find php8embed.lib (the embed SAPI static library)
          $lib = Get-ChildItem -Recurse -Filter "php8embed.lib" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($lib) {
            Copy-Item $lib.FullName sdk/lib/
            Write-Host "==> Found php8embed.lib at $($lib.FullName)"
          } else {
            Write-Error "php8embed.lib not found anywhere in build tree"
            exit 1
          }

          # Ship php8embed.lib's static dependency libraries too. spc's
          # --build-embed is a static build: php8embed.lib carries PHP's
          # own objects, but the third-party deps it was compiled against
          # (openssl/libcrypto, zlib, libxml2, ICU, oniguruma, sqlite3, ...)
          # live as separate .lib files under spc's buildroot. ephpm links
          # the embed lib STATICALLY (like libphp.a on Linux/macOS), so those
          # dep libs must be in the tarball or the final MSVC link fails with
          # unresolved externals. The Linux/macOS Package SDK steps already
          # copy every *.a from buildroot/lib for the same reason; do the
          # equivalent here.
          #
          # Sources, in priority order: every buildroot*/lib directory spc
          # produced, plus any .lib sitting alongside php8embed.lib. We do NOT
          # do a tree-wide *.lib copy -- that would sweep in MSVC/Windows-SDK
          # import libs. Scope to spc's own output dirs only.
          $depDirs = @()
          Get-ChildItem -Recurse -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -eq "lib" -and $_.Parent.Name -like "buildroot*" } |
            ForEach-Object { $depDirs += $_.FullName }
          $depDirs += (Split-Path $lib.FullName -Parent)
          $depDirs = $depDirs | Select-Object -Unique
          $copied = 0
          foreach ($dir in $depDirs) {
            Get-ChildItem -Path $dir -Filter "*.lib" -File -ErrorAction SilentlyContinue |
              ForEach-Object {
                Copy-Item $_.FullName sdk/lib/ -Force
                $copied++
              }
          }
          Write-Host "==> Staged $copied .lib file(s) from spc buildroot dirs: $($depDirs -join ', ')"

          # Diagnostic: full inventory of every .lib spc produced anywhere in
          # the tree (path + size). If the downstream static link still hits
          # unresolved externals, this log pinpoints which lib provides the
          # missing symbols and whether it shipped.
          Write-Host "==> Full .lib inventory in build tree:"
          Get-ChildItem -Recurse -Filter "*.lib" -File -ErrorAction SilentlyContinue |
            Sort-Object FullName |
            ForEach-Object { Write-Host ("    {0,12:N0}  {1}" -f $_.Length, $_.FullName) }

          Copy-Item -Recurse buildroot/include/php sdk/include/php

          # spc's Windows build (nmake-driven) doesn't install the
          # platform-specific PHP win32 headers into buildroot the way
          # autoconf's `make install-headers` does on Linux/macOS. The
          # generated headers (e.g. Zend/zend_stream.h:80) still expect
          # `#include "win32/ioutil.h"` relative to the main/ dir, so
          # without these consumers fail with `fatal error: 'win32/
          # ioutil.h' file not found` at the first compile. Stage them
          # from the PHP source tree directly so the published tarball
          # is self-contained.
          $win32SrcDir = Get-ChildItem -Directory source -ErrorAction SilentlyContinue |
            Where-Object { Test-Path "$($_.FullName)/win32/ioutil.h" } |
            Select-Object -First 1
          if (-not $win32SrcDir) {
            Write-Error "Could not find php-src/win32/ioutil.h under source/ - was the PHP source extracted?"
            exit 1
          }
          $win32Dest = "sdk/include/php/main/win32"
          New-Item -ItemType Directory -Force -Path $win32Dest | Out-Null
          Copy-Item "$($win32SrcDir.FullName)/win32/*.h" $win32Dest
          Write-Host "==> Staged win32 headers from $($win32SrcDir.FullName)/win32 -> $win32Dest"
          Get-ChildItem $win32Dest | ForEach-Object { Write-Host "    $($_.Name)" }

          # main/php_streams.h includes streams/php_stream_context.h (plus
          # several siblings: transport, filter_api, glob_wrapper, mmap,
          # userspace, streams_int) unconditionally. On Linux and macOS,
          # autoconf's `make install-headers` installs main/streams/*.h
          # alongside main/*.h. spc's Windows build (nmake) doesn't run
          # install-headers, so the streams/ subdirectory never makes it
          # into buildroot/include and the published tarball ships without
          # it - consumers fail to compile the first translation unit that
          # pulls in main/php.h. Stage the same way we stage win32/*.h:
          # copy the .h files directly from the extracted php-src tree.
          $streamsSrcDir = Get-ChildItem -Directory source -ErrorAction SilentlyContinue |
            Where-Object { Test-Path "$($_.FullName)/main/streams/php_stream_context.h" } |
            Select-Object -First 1
          if (-not $streamsSrcDir) {
            Write-Error "Could not find php-src/main/streams/php_stream_context.h under source/ - was the PHP source extracted?"
            exit 1
          }
          $streamsDest = "sdk/include/php/main/streams"
          New-Item -ItemType Directory -Force -Path $streamsDest | Out-Null
          Copy-Item "$($streamsSrcDir.FullName)/main/streams/*.h" $streamsDest
          Write-Host "==> Staged streams headers from $($streamsSrcDir.FullName)/main/streams -> $streamsDest"
          Get-ChildItem $streamsDest | ForEach-Object { Write-Host "    $($_.Name)" }

          # nmake install-headers on Windows doesn't recurse into ext/*
          # subdirectories. PHP's own headers cross-reference each other
          # with `#include "ext/standard/php_var.h"` from
          # ext/session/php_session.h (and several others), so the entire
          # ext/*/ header trees must be in the SDK tarball or downstream
          # compiles fail at the first translation unit that pulls in an
          # extension header.
          #
          # Recursive-by-default rather than per-subdir explicit list: we
          # don't know in advance which ext/<name>/ headers each PHP
          # release cross-references, and shipping more headers is cheap.
          # Mirrors the main/streams/ pattern above.
          $extSrcRoot = "$($streamsSrcDir.FullName)/ext"
          if (-not (Test-Path "$extSrcRoot/standard/php_var.h")) {
            Write-Error "Could not find php-src/ext/standard/php_var.h under $extSrcRoot"
            exit 1
          }
          $extDest = "sdk/include/php/ext"
          Get-ChildItem -Path $extSrcRoot -Recurse -Filter "*.h" |
            ForEach-Object {
              $rel = $_.FullName.Substring($extSrcRoot.Length).TrimStart('\','/')
              $dest = Join-Path $extDest $rel
              New-Item -ItemType Directory -Force -Path (Split-Path $dest -Parent) | Out-Null
              Copy-Item $_.FullName $dest
            }
          $extHeaderCount = (Get-ChildItem -Path $extDest -Recurse -Filter "*.h").Count
          Write-Host "==> Staged $extHeaderCount ext/*/*.h headers from $extSrcRoot -> $extDest"

          Write-Host "==> SDK contents:"
          Get-ChildItem -Recurse sdk/lib/

          # Guard: staged headers must match the requested version (see the
          # linux Package SDK step for the incident this prevents).
          $versionHeader = "sdk/include/php/main/php_version.h"
          $match = Select-String -Path $versionHeader -Pattern '#define PHP_VERSION "([^"]+)"'
          if (-not $match) {
            Write-Error "Could not read PHP_VERSION from $versionHeader"
            exit 1
          }
          $staged = $match.Matches[0].Groups[1].Value
          if ($staged -ne "${{ inputs.php_version }}") {
            Write-Error "staged PHP is '$staged' but this build was asked for '${{ inputs.php_version }}' - spc ignored --with-php"
            exit 1
          }
          Write-Host "==> Version guard OK: staged PHP $staged"

          # THIRD-PARTY-NOTICES.txt. No bin/php-config on Windows: it is a
          # POSIX shell script and nothing in the MSVC toolchain consumes
          # one. bash comes from the PortableGit install above.
          bash sdk-tools/tools/mk-sdk-metadata.sh sdk windows
          if ($LASTEXITCODE -ne 0) {
            Write-Error "mk-sdk-metadata.sh failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          tar czf php-sdk-${{ inputs.php_version }}-windows-x86_64.tar.gz -C sdk .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-sdk-${{ inputs.php_version }}-windows-x86_64
          path: php-sdk-${{ inputs.php_version }}-windows-x86_64.tar.gz

  # ============================================================================
  # EXPERIMENTAL: Windows x86_64 built with clang-cl + the TAILCALL VM.
  #
  # Motivation: every MSVC-compiled PHP gets the slow ZEND_VM_KIND_CALL
  # interpreter (Zend/zend_vm_opcodes.h selects HYBRID only under
  # __GNUC__ && HAVE_GCC_GLOBAL_REGS, never true on win32). PHP 8.5 added a
  # fifth VM kind, TAILCALL ([[clang::musttail]] + preserve_none), which on
  # Linux recovers essentially all of HYBRID's win — but it requires clang,
  # and HAVE_PRESERVE_NONE is only defined by an autoconf run-test that never
  # runs on Windows. This lane hand-defines it and builds PHP itself with
  # clang-cl (deps stay MSVC-built; clang-cl is MSVC-ABI-compatible, so the
  # resulting php8embed.lib links into the existing MSVC-target consumers
  # unchanged).
  #
  # MEASURED (2026-08-19, Ryzen 9 5950X, PHP 8.5.7 CLI, plain --disable-all
  # ZTS builds, best-of-5 hrtime CPU loops):
  #   - LLVM 22.1.8 clang-cl + TAILCALL: int-loop 8.4ms — 1.7x FASTER than
  #     MSVC 19.44's CALL VM (14.2ms); faster on string-append and
  #     function-call loops too. Reference mixed loop: 2.72ms vs 4.42ms.
  #   - The VS-BUNDLED clang-cl 19.1.5 is a trap: its Zend codegen is
  #     ~45-90% SLOWER than MSVC (int-loop 22.6ms ZTS / 20.3ms NTS), enough
  #     to swamp the VM-kind win entirely. That is why this job downloads a
  #     pinned LLVM release instead of installing the VS Clang component.
  # LLVM_VERSION below is pinned to the exact measured-good toolchain; bump
  # it only with fresh benchmark evidence.
  #
  # This job is additive-only: dispatched via platform=windows-x86_64-clang,
  # never part of `all`, never in versions.json platforms_required, and its
  # artifact name (php-sdk-<ver>-windows-x86_64-clang.tar.gz) can never
  # collide with the MSVC lane's.
  # ============================================================================
  build-windows-clang:
    name: Windows (x86_64, clang-cl TAILCALL, experimental)
    needs: setup
    if: needs.setup.outputs.build-windows-clang == 'true'
    runs-on: [self-hosted, windows, x64]
    # Same extension set as the MSVC lane — the artifact must differ ONLY in
    # the compiler and VM kind.
    env:
      WIN_PHP_EXTENSIONS: "bcmath,bz2,calendar,ctype,curl,dom,exif,fileinfo,filter,ftp,gd,gettext,hash,iconv,intl,mbregex,mbstring,mysqli,mysqlnd,opcache,openssl,pcre,pdo,pdo_mysql,pdo_sqlite,phar,session,simplexml,soap,sodium,sqlite3,tokenizer,xml,xmlreader,xmlwriter,xsl,zip,zlib"
      # Pinned LLVM toolchain (see job comment: VS-bundled clang 19 is slower
      # than MSVC; 22.1.8 is the measured-good floor).
      LLVM_VERSION: "22.1.8"
    steps:
      - name: Clean up previous builds
        shell: powershell
        run: |
          foreach ($dir in @('buildroot', 'source', 'downloads', 'sdk', 'php-sdk-binary-tools', 'php-src-clang')) {
            if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
          }
          Remove-Item -Force *.tar.gz -ErrorAction SilentlyContinue

      - name: Install Git for Windows
        shell: powershell
        run: |
          $gitRoot = "C:\Program Files\Git"
          if (-not (Test-Path "$gitRoot\cmd\git.exe")) {
            $ver = "2.49.0"
            $url = "https://github.com/git-for-windows/git/releases/download/v${ver}.windows.1/PortableGit-${ver}-64-bit.7z.exe"
            Write-Host "Downloading PortableGit $ver..."
            Invoke-WebRequest -Uri $url -OutFile portable-git.7z.exe
            Write-Host "Extracting to $gitRoot..."
            Start-Process -FilePath .\portable-git.7z.exe `
              -ArgumentList @("-o`"$gitRoot`"", '-y') -Wait -NoNewWindow
            Remove-Item portable-git.7z.exe
            if (-not (Test-Path "$gitRoot\cmd\git.exe")) {
              Write-Error "PortableGit extraction failed: $gitRoot\cmd\git.exe not found"
              exit 1
            }
          }
          "$gitRoot\cmd" | Out-File -Append -FilePath $env:GITHUB_PATH
          "$gitRoot\usr\bin" | Out-File -Append -FilePath $env:GITHUB_PATH

      - name: Checkout build tools
        uses: actions/checkout@v4
        with:
          path: sdk-tools

      - name: Install Visual Studio Build Tools
        shell: powershell
        # Identical to the MSVC lane: MSVC provides the linker, libs, headers
        # and builds every dependency. Only PHP itself compiles with clang-cl,
        # which comes from the pinned LLVM release in the next step — NOT from
        # VS's Clang component (VS bundles LLVM 19, whose Zend codegen is
        # slower than MSVC; see the job comment).
        run: |
          $installPath = "C:\BuildTools"
          $msbuild = "$installPath\MSBuild\Current\Bin\MSBuild.exe"
          $communityPath = "C:\Program Files\Microsoft Visual Studio\2022\Community"

          if (-not (Test-Path $msbuild)) {
            Write-Host "Downloading VS Build Tools bootstrapper..."
            Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vs_buildtools.exe" -OutFile vs_buildtools.exe

            Write-Host "Launching install (bootstrapper may exit before install completes)..."
            $proc = Start-Process -FilePath .\vs_buildtools.exe `
              -ArgumentList @(
                '--quiet', '--wait', '--norestart', '--nocache',
                '--installPath', $installPath,
                '--add', 'Microsoft.VisualStudio.Workload.VCTools',
                '--includeRecommended'
              ) -Wait -PassThru -NoNewWindow
            Write-Host "Bootstrapper exit code: $($proc.ExitCode)"
            Remove-Item vs_buildtools.exe

            $sw = [System.Diagnostics.Stopwatch]::StartNew()
            $timeoutMin = 20
            while (-not (Test-Path $msbuild) -and $sw.Elapsed.TotalMinutes -lt $timeoutMin) {
              Start-Sleep -Seconds 30
              Write-Host ("  ...waiting for VS install ({0:F0}s)" -f $sw.Elapsed.TotalSeconds)
            }

            if (-not (Test-Path $msbuild)) {
              Write-Host "::error::VS install timed out after $timeoutMin min - $msbuild never appeared"
              exit 1
            }
            Write-Host ("MSBuild.exe found after {0:F0}s" -f $sw.Elapsed.TotalSeconds)
          } else {
            Write-Host "VS Build Tools already present at $installPath"
          }

          # Junction the path spc's hardcoded check expects -> our install path
          if (-not (Test-Path $communityPath)) {
            $parent = Split-Path $communityPath -Parent
            if (-not (Test-Path $parent)) {
              New-Item -ItemType Directory -Path $parent -Force | Out-Null
            }
            New-Item -ItemType Junction -Path $communityPath -Target $installPath | Out-Null
            Write-Host "Junction $communityPath -> $installPath"
          }

      - name: Install pinned LLVM (clang-cl)
        shell: powershell
        # php-src's configure.js clang toolset resolves the compiler with
        # PATH_PROG('clang-cl'), so the pinned LLVM bin dir must be FIRST on
        # PATH (ahead of any VS-bundled clang). The version gate hard-fails
        # on mismatch rather than silently building with a slower compiler.
        run: |
          $llvmDir = "C:\llvm-${{ env.LLVM_VERSION }}"
          $clangCl = "$llvmDir\bin\clang-cl.exe"
          if (-not (Test-Path $clangCl)) {
            $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ env.LLVM_VERSION }}/clang+llvm-${{ env.LLVM_VERSION }}-x86_64-pc-windows-msvc.tar.xz"
            Write-Host "Downloading $url ..."
            Invoke-WebRequest -Uri $url -OutFile llvm.tar.xz
            New-Item -ItemType Directory -Force -Path $llvmDir | Out-Null
            tar -xf llvm.tar.xz -C $llvmDir --strip-components=1
            Remove-Item llvm.tar.xz
            if (-not (Test-Path $clangCl)) {
              Write-Error "LLVM extraction failed: $clangCl not found"
              exit 1
            }
          }
          $v = (& $clangCl --version | Select-String 'clang version ([\d\.]+)').Matches[0].Groups[1].Value
          Write-Host "clang-cl version: $v"
          if ($v -ne "${{ env.LLVM_VERSION }}") {
            Write-Error "clang-cl is $v, expected pinned ${{ env.LLVM_VERSION }}"
            exit 1
          }
          "$llvmDir\bin" | Out-File -Append -FilePath $env:GITHUB_PATH

      - name: Clone and patch php-src (clang toolset default + HAVE_PRESERVE_NONE)
        shell: powershell
        # Stock spc's Windows target hardcodes its configure.bat argument list
        # (no --with-toolset passthrough), so instead of forking spc we feed it
        # a pre-patched php-src via --custom-local (source is used in place,
        # never re-extracted — see spc's ArtifactExtractor). Two patches, both
        # hard-fail if the anchor text has drifted:
        #   1. win32/build/config.w32: force PHP_TOOLSET = "clang" right
        #      before toolset_option_handle(). An ARG_WITH default flip does
        #      NOT work: spc passes --disable-all, and conf_process_args
        #      resets every unseen configure arg to "no" (-> "vs").
        #   2. win32/build/config.w32: define HAVE_PRESERVE_NONE inside the
        #      CLANG_TOOLSET block (clang >= 19, x64). zend_portability.h
        #      detects musttail on its own; with both defined,
        #      Zend/zend_vm_opcodes.h selects ZEND_VM_KIND_TAILCALL.
        run: |
          git clone --depth 1 -c core.longpaths=true --branch php-${{ inputs.php_version }} https://github.com/php/php-src.git php-src-clang
          if ($LASTEXITCODE -ne 0) { Write-Error "php-src clone failed"; exit 1 }

          $cfg = "php-src-clang\win32\build\config.w32"
          $content = Get-Content $cfg -Raw

          $anchor1 = 'toolset_option_handle();'
          if (-not $content.Contains($anchor1)) {
            Write-Error "config.w32 toolset anchor not found - php-src build system changed, refusing to build (would silently produce an MSVC/CALL artifact)"
            exit 1
          }
          # NB: the comment must not contain the literal string ARG_WITH or
          # ARG_ENABLE — buildconf's preamble extractor greps for those and
          # would copy the comment line into configure.js as broken JS.
          $force = "/* Injected by php-sdk's windows-x86_64-clang lane: --disable-all resets`n   every unseen configure arg to `"no`", so a declaration-default can never`n   select the toolset. Force it before the handler runs. */`nPHP_TOOLSET = `"clang`";`ntoolset_option_handle();"
          $content = $content.Replace($anchor1, $force)

          $anchor2 = 'AC_DEFINE("PHP_HAVE_BUILTIN_SMULLL_OVERFLOW", 1, "Define to 1 if the compiler supports ''__builtin_smulll_overflow''.");'
          if (-not $content.Contains($anchor2)) {
            Write-Error "config.w32 CLANG_TOOLSET anchor not found - cannot inject HAVE_PRESERVE_NONE, refusing to build"
            exit 1
          }
          # Built line-by-line (no here-string: its closing "@ must sit at
          # column 0, which would terminate this YAML block scalar).
          $injectLines = @(
            $anchor2,
            '',
            "`tif (COMPILER_NUMERIC_VERSION >= 1900 && X64) {",
            "`t`t/* clang >= 19 supports __attribute__((preserve_none)) on x86-64.",
            "`t`t   Together with musttail (header-detected in zend_portability.h)",
            "`t`t   this selects the TAILCALL VM instead of the slow CALL VM.",
            "`t`t   Injected by php-sdk's windows-x86_64-clang lane. */",
            "`t`tAC_DEFINE(`"HAVE_PRESERVE_NONE`", 1, `"Define to 1 if the compiler supports '__attribute__((preserve_none))'.`");",
            "`t}"
          )
          $content = $content.Replace($anchor2, ($injectLines -join "`n"))
          Set-Content -Path $cfg -Value $content -Encoding ascii
          Write-Host "==> php-src patched for clang toolset + TAILCALL"

      - name: Download spc
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/luthermonson/static-php-cli/releases/download/${{ env.SPC_VERSION }}/spc-windows-x64.exe" -OutFile spc.exe
          "$PWD" | Out-File -Append -FilePath $env:GITHUB_PATH

      - name: Download PHP sources
        shell: powershell
        # Same retry loop as the MSVC lane (see its comments), plus
        # --custom-local pointing php-src at the patched clone. Everything
        # else (dep libraries) downloads and builds exactly as in the MSVC
        # lane — deps stay MSVC-built; only PHP itself compiles with clang-cl.
        run: |
          $phpSrc = "$PWD\php-src-clang"
          $max = 50
          for ($i = 1; $i -le $max; $i++) {
            $spcArgs = @(
              'download',
              '--with-php=${{ inputs.php_version }}',
              '--for-extensions=${{ env.WIN_PHP_EXTENSIONS }}',
              '--retry=3',
              '--prefer-pre-built',
              '--custom-local', "php-src:$phpSrc"
            )
            if ($i -eq $max) { $spcArgs += '-vv' }
            spc @spcArgs
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq $max) {
              Write-Error "spc download failed after $max attempts"
              exit 1
            }
            $s = Get-Random -Minimum 3 -Maximum 7
            Write-Host "spc download flaked (attempt $i), retrying in ${s}s..."
            Start-Sleep -Seconds $s
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run spc doctor
        shell: powershell
        run: |
          spc doctor --auto-fix
          exit 0

      - name: Add Strawberry Perl to PATH
        shell: powershell
        run: |
          $perlExe = Get-ChildItem -Recurse -Filter "perl.exe" -Path pkgroot -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "strawberry" } |
            Select-Object -First 1
          if ($perlExe) {
            $perlBin = $perlExe.DirectoryName
            Write-Host "Adding Strawberry Perl to PATH: $perlBin"
            $perlBin | Out-File -Append -FilePath $env:GITHUB_PATH
          } else {
            Write-Host "::warning::Strawberry Perl not found in pkgroot - falling back to system perl"
          }

      - name: Build php8embed (clang-cl toolset)
        shell: powershell
        run: |
          $spDir = Get-ChildItem -Directory pkgroot -Recurse -Filter "strawberry-perl*" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($spDir -and (Test-Path "$($spDir.FullName)\perl\bin\perl.exe")) {
            $env:PATH = "$($spDir.FullName)\perl\bin;$env:PATH"
          }
          # --dl-custom-local must be repeated here: the build phase runs its
          # own downloader pass (--dl-*) and re-resolves php-src without it,
          # silently replacing the patched tree with the stock tarball.
          $phpSrc = "$PWD\php-src-clang"
          spc build ${{ env.WIN_PHP_EXTENSIONS }} `
            --dl-with-php=${{ inputs.php_version }} `
            --dl-custom-local "php-src:$phpSrc" `
            --build-embed `
            --enable-zts `
            --no-strip `
            --debug

      - name: Verify VM kind is TAILCALL
        shell: powershell
        # Hard gate: the whole point of this lane. zend_vm_kind() is a
        # compile-time-constant return; disassemble it out of the built lib
        # and require `mov eax,5` (ZEND_VM_KIND_TAILCALL). Without this the
        # lane could silently regress to the CALL VM (kind 1) and nobody
        # would notice until a benchmark.
        run: |
          $lib = Get-ChildItem -Recurse -Filter "php8embed.lib" | Select-Object -First 1
          if (-not $lib) { Write-Error "php8embed.lib not found"; exit 1 }

          # zend_vm_kind() lives in zend_execute.obj (Zend/zend_vm_execute.h
          # is #included by zend_execute.c — there is no zend_vm_execute.obj).
          $vcvars = "C:\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          $obj = cmd /c "call `"$vcvars`" >nul 2>&1 && lib /nologo /list `"$($lib.FullName)`"" | Select-String "\\Zend\\zend_execute.obj" | Select-Object -First 1
          if (-not $obj) { Write-Error "Zend\zend_execute.obj not found in php8embed.lib"; exit 1 }
          $member = $obj.Line.Trim()
          Write-Host "==> Extracting $member"
          cmd /c "call `"$vcvars`" >nul 2>&1 && lib /nologo `"/extract:$member`" /out:zend_vm_execute_probe.obj `"$($lib.FullName)`""
          if (-not (Test-Path zend_vm_execute_probe.obj)) { Write-Error "lib /extract failed"; exit 1 }

          $disasm = cmd /c "call `"$vcvars`" >nul 2>&1 && dumpbin /disasm zend_vm_execute_probe.obj"
          $idx = ($disasm | Select-String -Pattern '^zend_vm_kind:$' | Select-Object -First 1).LineNumber
          if (-not $idx) { Write-Error "zend_vm_kind not found in disassembly"; exit 1 }
          $body = $disasm[($idx)..($idx + 3)] -join "`n"
          Write-Host "zend_vm_kind:`n$body"
          if ($body -match 'mov\s+eax,5') {
            Write-Host "==> VM kind VERIFIED: ZEND_VM_KIND_TAILCALL (5)"
          } else {
            Write-Error "VM kind is NOT TAILCALL - the artifact compiled the wrong interpreter. Refusing to publish."
            exit 1
          }
          Remove-Item zend_vm_execute_probe.obj -ErrorAction SilentlyContinue

      - name: Package SDK
        shell: powershell
        # Identical packaging to the MSVC lane, with the -clang artifact name.
        run: |
          New-Item -ItemType Directory -Force -Path sdk/lib, sdk/include

          $lib = Get-ChildItem -Recurse -Filter "php8embed.lib" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($lib) {
            Copy-Item $lib.FullName sdk/lib/
            Write-Host "==> Found php8embed.lib at $($lib.FullName)"
          } else {
            Write-Error "php8embed.lib not found anywhere in build tree"
            exit 1
          }

          $depDirs = @()
          Get-ChildItem -Recurse -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -eq "lib" -and $_.Parent.Name -like "buildroot*" } |
            ForEach-Object { $depDirs += $_.FullName }
          $depDirs += (Split-Path $lib.FullName -Parent)
          $depDirs = $depDirs | Select-Object -Unique
          $copied = 0
          foreach ($dir in $depDirs) {
            Get-ChildItem -Path $dir -Filter "*.lib" -File -ErrorAction SilentlyContinue |
              ForEach-Object {
                Copy-Item $_.FullName sdk/lib/ -Force
                $copied++
              }
          }
          Write-Host "==> Staged $copied .lib file(s) from spc buildroot dirs: $($depDirs -join ', ')"

          Copy-Item -Recurse buildroot/include/php sdk/include/php

          # win32 headers (see MSVC lane comments). The php-src tree is the
          # --custom-local clone in the workspace root, not under source/.
          $win32SrcDir = Get-Item "php-src-clang"
          if (-not (Test-Path "$($win32SrcDir.FullName)/win32/ioutil.h")) {
            Write-Error "php-src-clang/win32/ioutil.h missing - custom-local source tree incomplete"
            exit 1
          }
          $win32Dest = "sdk/include/php/main/win32"
          New-Item -ItemType Directory -Force -Path $win32Dest | Out-Null
          Copy-Item "$($win32SrcDir.FullName)/win32/*.h" $win32Dest
          Write-Host "==> Staged win32 headers"

          $streamsDest = "sdk/include/php/main/streams"
          New-Item -ItemType Directory -Force -Path $streamsDest | Out-Null
          Copy-Item "$($win32SrcDir.FullName)/main/streams/*.h" $streamsDest
          Write-Host "==> Staged streams headers"

          $extSrcRoot = "$($win32SrcDir.FullName)/ext"
          if (-not (Test-Path "$extSrcRoot/standard/php_var.h")) {
            Write-Error "Could not find php-src/ext/standard/php_var.h under $extSrcRoot"
            exit 1
          }
          $extDest = "sdk/include/php/ext"
          Get-ChildItem -Path $extSrcRoot -Recurse -Filter "*.h" |
            ForEach-Object {
              $rel = $_.FullName.Substring($extSrcRoot.Length).TrimStart('\','/')
              $dest = Join-Path $extDest $rel
              New-Item -ItemType Directory -Force -Path (Split-Path $dest -Parent) | Out-Null
              Copy-Item $_.FullName $dest
            }
          $extHeaderCount = (Get-ChildItem -Path $extDest -Recurse -Filter "*.h").Count
          Write-Host "==> Staged $extHeaderCount ext/*/*.h headers"

          # Strip HAVE_PRESERVE_NONE from the STAGED php_config.h. The built
          # lib runs the TAILCALL VM internally (the gate above proves it),
          # but the preserve_none opcode-handler calling convention is not
          # representable by MSVC consumers (__attribute__ is a no-op path:
          # they compile the CALL-view types) nor by bindgen (libclang
          # calling convention 20 panics rust-bindgen 0.72 — found building
          # ePHPm). The embed API surface does not expose handler pointers,
          # so the portable CALL-view header is safe for every consumer and
          # keeps clang- and MSVC-consumer views identical.
          # Both staged copies: php_config.h AND config.w32.h (Zend's
          # zend_config.h includes the latter — stripping only one is not
          # enough; found via a second bindgen panic).
          foreach ($configHeader in @("sdk/include/php/main/php_config.h", "sdk/include/php/main/config.w32.h")) {
            $cfgContent = Get-Content $configHeader -Raw
            if ($cfgContent -notmatch '(?m)^#define HAVE_PRESERVE_NONE 1\r?\n') {
              Write-Error "HAVE_PRESERVE_NONE not found in $configHeader - did the TAILCALL configure define go missing?"
              exit 1
            }
            $cfgContent = $cfgContent -replace '(?m)^#define HAVE_PRESERVE_NONE 1\r?\n', "/* HAVE_PRESERVE_NONE intentionally removed from the staged SDK header (see the php-sdk windows-x86_64-clang lane). */`n"
            # Same treatment for the clang-only __builtin_* capability defines
            # (config.w32's CLANG_TOOLSET block AC_DEFINEs them): Zend headers
            # gate STATIC INLINE fast paths on these, so an MSVC consumer
            # compiling the SDK headers emits calls to __builtin_expect /
            # __builtin_*_overflow it can never link (LNK2001 — found
            # building ePHPm). MSVC consumers get the same fallback paths the
            # MSVC-lane headers give them.
            $cfgContent = $cfgContent -replace '(?m)^#define (PHP_HAVE_BUILTIN_\w+) 1\r?\n', "/* `$1 removed for MSVC consumers (clang-only builtin; see windows-x86_64-clang lane) */`n"
            Set-Content -Path $configHeader -Value $cfgContent -Encoding ascii -NoNewline
            Write-Host "==> Stripped clang-only defines from $configHeader"
          }

          # Version guard (see MSVC lane for the incident this prevents).
          $versionHeader = "sdk/include/php/main/php_version.h"
          $match = Select-String -Path $versionHeader -Pattern '#define PHP_VERSION "([^"]+)"'
          if (-not $match) {
            Write-Error "Could not read PHP_VERSION from $versionHeader"
            exit 1
          }
          $staged = $match.Matches[0].Groups[1].Value
          if ($staged -ne "${{ inputs.php_version }}") {
            Write-Error "staged PHP is '$staged' but this build was asked for '${{ inputs.php_version }}'"
            exit 1
          }
          Write-Host "==> Version guard OK: staged PHP $staged"

          bash sdk-tools/tools/mk-sdk-metadata.sh sdk windows
          if ($LASTEXITCODE -ne 0) {
            Write-Error "mk-sdk-metadata.sh failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          tar czf php-sdk-${{ inputs.php_version }}-windows-x86_64-clang.tar.gz -C sdk .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-sdk-${{ inputs.php_version }}-windows-x86_64-clang
          path: php-sdk-${{ inputs.php_version }}-windows-x86_64-clang.tar.gz

  release:
    name: Create Release
    needs: [build-linux, build-macos, build-windows, build-windows-clang]
    # Partial rebuilds skip the un-targeted build jobs (skipped != failure),
    # but a real failure should still abort the release.
    if: |
      always()
      && needs.build-linux.result   != 'failure'
      && needs.build-macos.result   != 'failure'
      && needs.build-windows.result != 'failure'
      && needs.build-windows-clang.result != 'failure'
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/ || { echo "::error::no artifacts produced"; exit 1; }

      - name: Create release
        uses: softprops/action-gh-release@v2
        # action-gh-release replaces only assets whose filenames match what
        # we upload. Tarballs for platforms we didn't rebuild stay attached
        # to the existing release tag untouched.
        #
        # The tag carries release_tag_suffix so test/validation dispatches
        # (which MUST set a suffix) upload to their own tag instead of
        # overwriting production assets (see the input's description for the
        # 2026-07-13 v8.5.7 incident).
        with:
          tag_name: v${{ inputs.php_version }}${{ inputs.release_tag_suffix }}
          name: PHP ${{ inputs.php_version }}${{ inputs.release_tag_suffix }}
          body: |
            Pre-built PHP embed SAPI SDK for ephpm.

            **PHP version:** ${{ inputs.php_version }}
            **Extensions:** ${{ env.PHP_EXTENSIONS }}

            ## Artifacts

            | File | Platform |
            |------|----------|
            | `php-sdk-${{ inputs.php_version }}-linux-x86_64.tar.gz` | Linux x86_64 (musl static) |
            | `php-sdk-${{ inputs.php_version }}-linux-aarch64.tar.gz` | Linux aarch64 (musl static) |
            | `php-sdk-${{ inputs.php_version }}-linux-x86_64-gnu.tar.gz` | Linux x86_64 (glibc, floor 2.28) |
            | `php-sdk-${{ inputs.php_version }}-linux-aarch64-gnu.tar.gz` | Linux aarch64 (glibc, floor 2.28) |
            | `php-sdk-${{ inputs.php_version }}-macos-aarch64.tar.gz` | macOS Apple Silicon |
            | `php-sdk-${{ inputs.php_version }}-windows-x86_64.tar.gz` | Windows x86_64 (ZTS) |

            All of the above are thread-safe (ZTS). Non-thread-safe variants
            (Linux glibc only, extension set plus `ffi`) are built on demand
            for consumers that need one: `-gnu-nts` ships static `libphp.a`
            plus `embed/resolver_shim.c` and `EMBEDDING.md`, and
            `-gnu-nts-shared` ships `libphp.so` with dependencies linked in.
            They are not part of every release and are not required for a
            release to be considered complete. Check the asset list above for
            whether this release has them.

            `php-sdk-<ver>-windows-x86_64-clang.tar.gz`, when present, is the
            EXPERIMENTAL clang-cl/TAILCALL-VM Windows build — ~1.7x faster VM
            dispatch than the MSVC lane, built with a pinned LLVM release
            (dispatched explicitly, never required; see the
            build-windows-clang job comments and the README before adopting).

            Each tarball contains `lib/`, `include/php/`,
            `THIRD-PARTY-NOTICES.txt`, and — on Linux and macOS — a
            relocatable `bin/php-config`.
          files: artifacts/*.tar.gz

      # Completeness gate: compare the assets actually attached to the release
      # tag against `platforms_required` in versions.json (the tarballs ephpm
      # hard-depends on; the musl `platforms_optional` entries never gate).
      #
      #   - platform=all runs: any missing REQUIRED asset is a hard failure.
      #     Incident 2026-07-10: v8.4.23 was published with 4/6 assets and
      #     nobody noticed until a consumer 404'd.
      #   - single-platform runs: this run's OWN asset missing is a hard
      #     failure; other still-missing required assets are ::warning only
      #     (partial uploads are by design).
      #
      # Implemented with github-script rather than gh/jq because the release
      # job runs on a self-hosted runner where neither tool is guaranteed
      # (see the download-artifact comment above) -- node always exists.
      - name: Checkout (versions.json for completeness check)
        uses: actions/checkout@v4

      - name: Verify release completeness
        uses: actions/github-script@v7
        env:
          PHP_VERSION: ${{ inputs.php_version }}
          RELEASE_TAG: v${{ inputs.php_version }}${{ inputs.release_tag_suffix }}
          PLATFORM: ${{ inputs.platform }}
        with:
          script: |
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('versions.json', 'utf8'));
            const version = process.env.PHP_VERSION;
            const tag = process.env.RELEASE_TAG;
            const platform = process.env.PLATFORM || 'all';

            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            });
            const assets = release.data.assets.map((a) => a.name);
            core.info(`Assets on ${tag}:\n  ${assets.join('\n  ') || '(none)'}`);

            const assetFor = (p) => `php-sdk-${version}-${p}.tar.gz`;
            const missingRequired = manifest.platforms_required.filter(
              (p) => !assets.includes(assetFor(p)),
            );
            const missingOptional = manifest.platforms_optional.filter(
              (p) => !assets.includes(assetFor(p)),
            );
            if (missingOptional.length > 0) {
              core.info(
                `Optional (musl) assets not present -- informational only: ${missingOptional.join(', ')}`,
              );
            }

            if (platform === 'all') {
              if (missingRequired.length > 0) {
                core.setFailed(
                  `release ${tag} is INCOMPLETE -- missing required platform(s): ${missingRequired.join(', ')}. ` +
                  `Re-dispatch build.yml per missing platform to backfill.`,
                );
                return;
              }
              core.info(`release ${tag} is complete: all required platforms present.`);
              return;
            }

            // Single-platform run: our own tarball must have landed.
            if (!assets.includes(assetFor(platform))) {
              core.setFailed(
                `this run built ${platform} but ${assetFor(platform)} is not attached to ${tag} -- upload failed?`,
              );
              return;
            }
            core.info(`own asset ${assetFor(platform)} present on ${tag}.`);
            if (missingRequired.length > 0) {
              core.warning(
                `release ${tag} is still missing required platform(s): ${missingRequired.join(', ')} ` +
                `(not built by this single-platform run).`,
              );
            }
