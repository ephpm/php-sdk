name: Build ZTS Extension Catalog
run-name: "Build extensions for PHP ${{ inputs.php_version }}"

# Builds loadable ZTS glibc shared extension .so files for ephpm.
#
# WHY THIS EXISTS
# ephpm ships glibc-dynamic Linux release binaries that dlopen PHP shared
# extensions at runtime via the [php] extensions = [...] config knob. Debian
# and Sury publish ZERO ZTS extension builds, so there is nothing off-the-shelf
# for users to load. This workflow is the primary source of loadable
# extensions for that fleet.
#
# ABI MATCH REQUIREMENT (hard)
# Each .so must match the ephpm PHP binary ABI exactly or PHP rejects it at
# load time:
#   - same PHP minor as the SDK the ephpm binary was linked against
#   - ZTS (thread-safe) build. An NTS .so fails with
#     "undefined symbol: compiler_globals"
#   - glibc (gnu) libc, non-debug
# The SDK tarballs from build.yml are ZTS + embed; these extensions are built
# against a PHP compiled from the SAME pinned source (our php-sources mirror)
# with the SAME --enable-zts flag, so the module API numbers line up.
#
# BUILD MACHINERY
# Reuses build.yml's gnu container flow verbatim: ubuntu:24.04 container,
# native gcc (= glibc), SPC_TARGET=<arch>-linux-gnu, spc fetched to /tmp/spcbin
# and PATHed, php-src pre-fetched by plain curl from our own php-sources
# release tag and handed to spc as a file:// custom-url. The only new piece is
# `spc build ... --build-shared=<exts>`, spc's native loadable-.so path (the
# -D / --build-shared flag on build:php), which emits per-extension .so files
# linked against the embed+ZTS PHP built in the same invocation.
#
# HARD RULE (cost 5 failed CI runs, see build.yml history)
# The container step passes its script as a single-quoted `sh -c '...'`. NO
# apostrophes anywhere inside that block - a stray apostrophe in a comment
# terminates the quote and the rest silently runs on the runner host, not the
# container. The `id` debug line proves we are inside the container (container
# uid, not the uid=1001 self-hosted runner).

on:
  workflow_dispatch:
    inputs:
      php_version:
        description: "PHP version to build extensions for (e.g. 8.5.7)"
        required: true
        type: string
      platform:
        description: "Which platform(s) to build extensions for."
        required: false
        type: choice
        default: linux-x86_64-gnu
        options:
          - all
          - linux-x86_64-gnu
          - linux-aarch64-gnu
          - macos-aarch64
      extensions:
        description: "Comma-separated extensions to build (curated ZTS-clean set)"
        required: false
        type: string
        default: "igbinary,msgpack,apcu,redis,mongodb,xdebug"
      php_src_url:
        description: "Override URL for the php-src tarball. REQUIRED for a
          PRE-RELEASE (beta/RC), same contract as build.yml php_src_url.
          e.g. https://downloads.php.net/~svpernova09/php-8.6.0beta1.tar.gz .
          Leave empty for GA builds (php-src comes from the php-sources mirror)."
        required: false
        type: string
        default: ""

env:
  SPC_VERSION: "v3.0.0-pgo-rc19"
  # Xdebug is pinned per PHP minor instead of letting spc resolve it: the
  # ext-xdebug pie source takes the newest Packagist release, which is a
  # pre-release (3.6.0alpha1) as soon as one is tagged. 3.5.x configure
  # rejects PHP >= 8.6, so 8.6 builds use the 3.6 pre-release. Source is
  # the GitHub tag archive, sha256-verified, handed to spc via --custom-url.
  XDEBUG_STABLE: "3.5.3"
  XDEBUG_STABLE_SHA256: "954e56021668121ecc50b92d2ad1ce945f22ecf81ffc5bb5835219485b12ef5f"
  XDEBUG_NEXT: "3.6.0alpha1"
  XDEBUG_NEXT_SHA256: "e4f1ad4de249cb1f64173bbace2ae6d5974537053830a6b16e0f1f19c6fa2f3c"

jobs:
  # Resolve the platform input into a Linux matrix, mirroring build.yml.setup.
  # Only glibc (gnu) flavors: ephpm dlopens extensions from its glibc-dynamic
  # Linux binaries. The musl fully-static SDK never dlopens anything.
  setup:
    name: Setup (resolve target platforms)
    runs-on: ubuntu-latest
    outputs:
      linux-matrix: ${{ steps.compute.outputs.linux-matrix }}
      build-macos: ${{ steps.compute.outputs.build-macos }}
      spc-version: ${{ steps.compute.outputs.spc-version }}
      prerelease: ${{ steps.compute.outputs.prerelease }}
      xdebug-version: ${{ steps.compute.outputs.xdebug-version }}
      xdebug-sha256: ${{ steps.compute.outputs.xdebug-sha256 }}
    steps:
      - id: compute
        env:
          PLATFORM: ${{ inputs.platform }}
          PHP_VERSION: ${{ inputs.php_version }}
          PHP_SRC_URL: ${{ inputs.php_src_url }}
        run: |
          # Same version classification as build.yml setup: spc --with-php
          # only accepts x.y or x.y.z, so a pre-release passes major.minor
          # and must bring its own php-src via php_src_url.
          if printf '%s' "$PHP_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "spc-version=$PHP_VERSION" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            mm=$(printf '%s' "$PHP_VERSION" | grep -oE '^[0-9]+\.[0-9]+')
            if [ -z "$mm" ]; then
              echo "::error::php_version '$PHP_VERSION' has no numeric major.minor prefix"
              exit 1
            fi
            if [ -z "$PHP_SRC_URL" ]; then
              echo "::error::php_version '$PHP_VERSION' is a pre-release but php_src_url is empty"
              exit 1
            fi
            echo "spc-version=$mm" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          case "$PHP_VERSION" in
            8.3.*|8.4.*|8.5.*)
              echo "xdebug-version=${{ env.XDEBUG_STABLE }}" >> "$GITHUB_OUTPUT"
              echo "xdebug-sha256=${{ env.XDEBUG_STABLE_SHA256 }}" >> "$GITHUB_OUTPUT" ;;
            8.6.*)
              echo "xdebug-version=${{ env.XDEBUG_NEXT }}" >> "$GITHUB_OUTPUT"
              echo "xdebug-sha256=${{ env.XDEBUG_NEXT_SHA256 }}" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "xdebug-version=" >> "$GITHUB_OUTPUT"
              echo "xdebug-sha256=" >> "$GITHUB_OUTPUT" ;;
          esac

          # Build the ZTS shared-extension catalog on the SAME almalinux:8
          # base (glibc 2.28, gcc-toolset-13) as build.yml's gnu SDK jobs, so
          # the .so files match the SDK's glibc 2.28 floor. A catalog compiled
          # on a newer glibc would refuse to load into a 2.28-floored ephpm
          # binary on older hosts.
          gnu_x64='{"arch":"x86_64","libc":"gnu","image":"docker.io/library/almalinux:8","suffix":"-gnu","runner":["self-hosted","linux","x64"]}'
          gnu_arm='{"arch":"aarch64","libc":"gnu","image":"docker.io/library/almalinux:8","suffix":"-gnu","runner":["self-hosted","linux","arm64"]}'
          case "$PLATFORM" in
            all)                lm="[$gnu_x64,$gnu_arm]"; mac=true ;;
            linux-x86_64-gnu)   lm="[$gnu_x64]";          mac=false ;;
            linux-aarch64-gnu)  lm="[$gnu_arm]";          mac=false ;;
            macos-aarch64)      lm="[]";                  mac=true ;;
            *) echo "::error::unknown platform $PLATFORM"; exit 1 ;;
          esac
          echo "linux-matrix=$lm" >> "$GITHUB_OUTPUT"
          echo "build-macos=$mac" >> "$GITHUB_OUTPUT"

  build-extensions:
    name: Extensions (${{ matrix.arch }}, ${{ matrix.libc }})
    needs: setup
    if: needs.setup.outputs.linux-matrix != '[]'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.linux-matrix) }}
    steps:
      - name: Clean up previous builds
        run: |
          rm -rf output ext-out *.tar.gz
          docker rm -f "spc-ext-${{ matrix.libc }}" 2>/dev/null || true

      - name: Build shared extensions inside container (${{ matrix.libc }})
        # Same almalinux:8 + gcc-toolset-13 (glibc 2.28) container as
        # build.yml's gnu SDK jobs. The single change from the SDK build is
        # --build-shared=<exts>, which asks spc to emit standalone loadable
        # .so files in addition to the embed PHP. Everything else (SPC_TARGET,
        # /tmp/spcbin, file:// php-src) is copied verbatim to preserve the
        # fleet fixes those lines encode.
        # Pre-release (8.6) spc workarounds are the same as build.yml
        # PRERELEASE_ENV (PRs #56/#57/#59): empty SPC_MICRO_PATCHES, and
        # --enable-pic in place of the removed --with-pic. The build.yml
        # --build-cli workaround is passed as SPC_EXTRA_BUILD_SAPI.
        run: |
          PRERELEASE_ENV=()
          if [ "${{ needs.setup.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_ENV=(
              -e "SPC_MICRO_PATCHES="
              -e "SPC_CMD_PREFIX_PHP_CONFIGURE=./configure --prefix= --with-valgrind=no --disable-shared --enable-static --disable-all --disable-phpdbg --enable-rtld-now --enable-re2c-cgoto --disable-rpath --enable-pic"
              -e "SPC_EXTRA_BUILD_SAPI=--build-cli"
            )
          fi
          docker run --name "spc-ext-${{ matrix.libc }}" \
            -e GITHUB_TOKEN="${GITHUB_TOKEN}" \
            -e SPC_VERSION="${{ env.SPC_VERSION }}" \
            -e PHP_VERSION="${{ inputs.php_version }}" \
            -e SPC_WITH_PHP="${{ needs.setup.outputs.spc-version }}" \
            -e PHP_SRC_URL="${{ inputs.php_src_url }}" \
            -e XDEBUG_VERSION="${{ needs.setup.outputs.xdebug-version }}" \
            -e XDEBUG_SHA256="${{ needs.setup.outputs.xdebug-sha256 }}" \
            -e EXTENSIONS="${{ inputs.extensions }}" \
            -e LIBC="${{ matrix.libc }}" \
            "${PRERELEASE_ENV[@]}" \
            "${{ matrix.image }}" sh -c '
              set -eux

              # almalinux:8 (glibc 2.28), Docker-format so the fleet can run it.
              # gcc-toolset-13 NOT 14 (GCC 14 hard-errors on the implicit
              # strlcpy in PHP ext/openssl on glibc 2.28; GCC 13 warns and links
              # against PHP built-in strlcpy). re2c is EPEL/PowerTools on
              # AlmaLinux 8 (not preinstalled); enable both, keep re2c
              # non-fatal, spc doctor --auto-fix builds it if absent.
              dnf install -y dnf-plugins-core epel-release
              dnf config-manager --set-enabled powertools 2>/dev/null \
                || dnf config-manager --set-enabled crb 2>/dev/null || true
              dnf install -y --allowerasing \
                bash ca-certificates curl git gcc-toolset-13 autoconf \
                automake bison cmake flex libtool make pkgconfig \
                tar xz which file binutils python3 jq
              dnf install -y re2c || echo "re2c not packaged; spc doctor will build it"
              . /opt/rh/gcc-toolset-13/enable

              # Native gcc links against the image libc: glibc 2.28 on almalinux:8.
              export SPC_TOOLCHAIN="StaticPHP\\Toolchain\\GccNativeToolchain"
              # gnu builds must override the env.ini default SPC_TARGET of
              # <arch>-linux-musl or the libc self-check aborts (see build.yml).
              export SPC_TARGET="$(uname -m)-linux-gnu"

              # Prove we are inside the container: this must print the
              # container uid (root), never uid=1001 the self-hosted runner.
              id && ls -ld /usr/local/bin || true

              # Extract spc into a fresh temp dir and PATH it (userns write
              # denial into /usr/local/bin on the ubuntu image, see build.yml).
              mkdir -p /tmp/spcbin
              curl -fsSL "https://github.com/luthermonson/static-php-cli/releases/download/${SPC_VERSION}/spc-linux-$(uname -m).tar.gz" \
                | tar xz --no-same-owner --no-same-permissions -C /tmp/spcbin
              chmod +x /tmp/spcbin/spc
              export PATH="/tmp/spcbin:${PATH}"

              mkdir /build && cd /build

              # php-src from our own GitHub mirror (release tag php-sources):
              # fleet egress to php.net is unreliable and pinned tarballs make
              # builds deterministic. Pre-fetch with plain curl and hand spc a
              # file:// URL (spc internal HTTP client fails on the release-asset
              # redirect from the runner). Refresh the mirror when bumping PHP.
              # A pre-release (PHP_SRC_URL set) fetches the beta/RC tarball
              # from that URL instead; the mirror is GA-only.
              if [ -n "${PHP_SRC_URL:-}" ]; then
                php_src_fetch_url="${PHP_SRC_URL}"
              else
                php_src_fetch_url="https://github.com/ephpm/php-sdk/releases/download/php-sources/php-${PHP_VERSION}.tar.gz"
              fi
              j=0
              until curl -fsSL -o /tmp/php-src-mirror.tar.gz "${php_src_fetch_url}"; do
                j=$((j + 1))
                if [ "$j" -ge 5 ]; then
                  echo "php-src fetch failed after $j attempts (${php_src_fetch_url})" >&2
                  exit 1
                fi
                sleep 3
              done

              # Pinned xdebug source (see XDEBUG_* in the workflow env). Passed
              # to both spc download and spc build so neither phase resolves
              # ext-xdebug through pie, which would pick the newest Packagist
              # release.
              XDEBUG_URLS=""
              case ",${EXTENSIONS}," in
                *,xdebug,*)
                  if [ -z "${XDEBUG_VERSION:-}" ]; then
                    echo "::error::no pinned xdebug version for PHP ${PHP_VERSION}" >&2
                    exit 1
                  fi
                  j=0
                  until curl -fsSL -o /tmp/xdebug-src.tar.gz \
                      "https://github.com/xdebug/xdebug/archive/refs/tags/${XDEBUG_VERSION}.tar.gz"; do
                    j=$((j + 1))
                    if [ "$j" -ge 5 ]; then
                      echo "xdebug ${XDEBUG_VERSION} fetch failed after $j attempts" >&2
                      exit 1
                    fi
                    sleep 3
                  done
                  echo "${XDEBUG_SHA256}  /tmp/xdebug-src.tar.gz" | sha256sum -c -
                  XDEBUG_URLS="--custom-url=ext-xdebug:file:///tmp/xdebug-src.tar.gz"
                  echo "==> xdebug pinned to ${XDEBUG_VERSION}"
                  ;;
              esac

              # Download php-src plus the source for every extension we build:
              # the minimal static base compiled into the embed PHP AND the
              # shared catalog. Both must be resolvable or spc download errors.
              # Retry to tolerate transient upstream flakes (pecl, GitHub API).
              ALL_EXTENSIONS="pcre,mbstring,session,openssl,hash,json,filter,${EXTENSIONS}"

              # Same GNU dependency mirror the SDK builds use: libiconv and
              # friends resolve through ftpmirror.gnu.org, which has no
              # source-mirror fallback in spc and takes the whole download
              # down when it serves a bad backend. See build.yml for the full
              # rationale. Populated by mirror-deps.yml; absent manifest
              # means fall back to upstream with a warning.
              CUSTOM_URLS=""
              mkdir -p /tmp/deps
              if curl -fsSL -o /tmp/deps/manifest.txt \
                  "https://github.com/ephpm/php-sdk/releases/download/php-sources/gnu-deps-manifest.txt"; then
                while read -r dep_name dep_file; do
                  if [ -z "${dep_name}" ] || [ -z "${dep_file}" ]; then
                    continue
                  fi
                  if curl -fsSL -o "/tmp/deps/${dep_file}" \
                      "https://github.com/ephpm/php-sdk/releases/download/php-sources/${dep_file}"; then
                    CUSTOM_URLS="${CUSTOM_URLS} --custom-url=${dep_name}:file:///tmp/deps/${dep_file}"
                    echo "==> mirrored ${dep_name} as ${dep_file}"
                  else
                    echo "::warning::manifest lists ${dep_file} but it did not download; letting spc fetch ${dep_name} upstream"
                  fi
                done < /tmp/deps/manifest.txt
              else
                echo "::warning::no gnu-deps-manifest.txt on the php-sources release tag - falling back to upstream GNU mirrors, which are the known failure mode. Run mirror-deps.yml to populate it."
              fi

              i=0
              until spc download \
                  --with-php=${SPC_WITH_PHP} \
                  --for-extensions=${ALL_EXTENSIONS} \
                  --custom-url="php-src:file:///tmp/php-src-mirror.tar.gz" \
                  ${CUSTOM_URLS} \
                  ${XDEBUG_URLS} \
                  --prefer-pre-built; do
                i=$((i + 1))
                if [ "$i" -ge 8 ]; then
                  echo "spc download failed after $i attempts" >&2
                  exit 1
                fi
                s=$(awk "BEGIN{srand(); b=5*(2^($i-1)); if(b>300)b=300; print int(b)+int(rand()*5)}")
                echo "spc download flaked (attempt $i), retrying in ${s}s..."
                sleep "$s"
              done

              spc doctor --auto-fix || true

              # Build an embed + ZTS PHP from the pinned source and, in the same
              # invocation, emit each requested extension as a loadable shared
              # .so via --build-shared. --dl-with-php pins the build-phase
              # downloader to the requested version (see build.yml for the
              # mislabel incident this prevents). --enable-zts is the ABI
              # contract: the .so files export/import thread-safe symbols so
              # ephpm (also ZTS) can dlopen them. A non-ZTS .so would fail with
              # undefined symbol compiler_globals at load.
              # NOTE: this comment is inside a single-quoted sh -c block -
              # apostrophes here would terminate the string. Keep it apostrophe
              # free.
              # The positional <extensions> is REQUIRED by spc build:php even
              # when only shared output is wanted (empirically: omitting it
              # fails with "Not enough arguments (missing extensions)"). It is
              # the STATIC set compiled into the embed PHP that the shared .so
              # files then link/load against. Use a minimal base that satisfies
              # the catalog deps (session for redis, openssl/hash for mongodb,
              # pcre/mbstring are near-universal) rather than compiling every
              # heavy catalog ext (mongodb, grpc) statically too. --build-shared
              # carries the actual loadable catalog. Confirmed locally: with
              # igbinary in both slots the shared igbinary.so lands in
              # buildroot/modules and passes the ZTS nm check.
              # --dl-custom-url keeps the build phase on the same php-src and
              # xdebug tarballs the download phase used (build.yml does the
              # same for php-src; without it a pre-release re-resolves php-src
              # through the GA-only php.net resolver).
              BASE_EXTENSIONS="pcre,mbstring,session,openssl,hash,json,filter"
              XDEBUG_DL_URLS=""
              if [ -n "${XDEBUG_URLS}" ]; then
                XDEBUG_DL_URLS="--dl-custom-url=ext-xdebug:file:///tmp/xdebug-src.tar.gz"
              fi
              spc build ${BASE_EXTENSIONS} \
                --dl-with-php=${SPC_WITH_PHP} \
                --dl-custom-url="php-src:file:///tmp/php-src-mirror.tar.gz" \
                ${XDEBUG_DL_URLS} \
                ${SPC_EXTRA_BUILD_SAPI:-} \
                --build-embed \
                --enable-zts \
                --no-strip \
                --build-shared=${EXTENSIONS} || {
                  echo "==> spc build failed; tail of /build/log/spc.shell.log:" >&2
                  tail -n 100 /build/log/spc.shell.log >&2 || true
                  exit 1
                }

              # Version guard: the PHP we built the extensions against must be
              # the requested version. spc has silently fallen back to latest
              # stable before (see build.yml). Read it from the staged headers.
              PHP_VER_H=$(find /build/buildroot/include -name php_version.h -path "*main*" | head -n 1)
              staged=$(sed -n "s/^#define PHP_VERSION \"\\(.*\\)\"/\\1/p" "$PHP_VER_H")
              if [ "$staged" != "${PHP_VERSION}" ]; then
                echo "::error::extensions built against PHP $staged but asked for ${PHP_VERSION}" >&2
                exit 1
              fi
              echo "==> Version guard OK: extensions built against PHP $staged"

              # The Zend module API number every .so is stamped with. ephpm and
              # every loadable .so must share it. Pulled from the same headers
              # the extensions compiled against.
              API_H=$(find /build/buildroot/include -name zend_modules.h | head -n 1)
              PHP_API_NO=$(sed -n "s/^#define ZEND_MODULE_API_NO \\([0-9]*\\).*/\\1/p" "$API_H")
              echo "==> ZEND_MODULE_API_NO=${PHP_API_NO}"

              # Collect the shared .so files. spc emits build-shared output under
              # buildroot; discover by find rather than assuming a fixed path
              # (spc install layout nests at varying depths, see build.yml).
              mkdir -p /output/ext
              found=0
              for ext in $(echo "${EXTENSIONS}" | tr "," " "); do
                so=$(find /build/buildroot -name "${ext}.so" -type f 2>/dev/null | head -n 1)
                if [ -z "$so" ]; then
                  echo "::warning::no .so produced for ${ext} - deferred or build-shared unsupported for it"
                  continue
                fi
                cp -Lf "$so" /output/ext/
                found=$((found + 1))
                echo "==> staged ${ext}.so from $so"
              done
              if [ "$found" -eq 0 ]; then
                echo "::error::no shared extension .so files were produced" >&2
                echo "==> full .so inventory under buildroot for debugging:" >&2
                find /build/buildroot -name "*.so" -type f >&2 || true
                exit 1
              fi

              # Verify each .so is ZTS and loadable. A ZTS ext .so:
              #   - exports get_module (the module entry PHP dlsym-s)
              #   - imports (U, undefined) TSRM globals ACCESSOR symbols:
              #     *_globals_offset / *_globals_id / ts_allocate_id /
              #     tsrm_get_ls_cache. An NTS .so instead references the raw
              #     compiler_globals / executor_globals structs directly and
              #     carries none of the _offset/_id/tsrm_ accessors - and would
              #     fail to load into ephpm with "undefined symbol
              #     compiler_globals". Verified locally against igbinary.so
              #     (PHP 8.5.7): U basic_globals_id, U compiler_globals_offset,
              #     U executor_globals_offset, U ts_allocate_id,
              #     U tsrm_get_ls_cache.
              # A Zend extension (xdebug) is loaded via zend_extension= and is
              # found through its exported zend_extension_entry; the manifest
              # records which loader directive each .so needs.
              for so in /output/ext/*.so; do
                echo "==> nm sanity for $so"
                if ! nm -D --defined-only "$so" 2>/dev/null | grep -Eqw "get_module|zend_extension_entry"; then
                  echo "::error::$so exports neither get_module nor zend_extension_entry - not a loadable PHP module" >&2
                  exit 1
                fi
                if [ "$(basename "$so")" = "xdebug.so" ] \
                    && ! nm -D --defined-only "$so" 2>/dev/null | grep -qw "zend_extension_entry"; then
                  echo "::error::$so does not export zend_extension_entry" >&2
                  exit 1
                fi
                if nm -D "$so" 2>/dev/null | grep -Eq "_globals_offset|_globals_id|ts_allocate_id|tsrm_get_ls_cache"; then
                  echo "    ZTS symbols present (TSRM globals accessors)"
                else
                  echo "::error::$so has no TSRM accessor symbols - built NTS, would fail ephpm load" >&2
                  exit 1
                fi
              done

              # Build manifest.json: one entry per staged .so with name,
              # extension version (from its .so via php ext version string if
              # present, else unknown), php_api_no, zts=1, zend_extension,
              # sha256. xdebug has no "<name> <ver>" string to scrape; its
              # version is the pinned one, checked against the literal
              # XDEBUG_VERSION string compiled into the .so.
              cd /output/ext
              {
                echo "{"
                echo "  \"php_version\": \"${PHP_VERSION}\","
                echo "  \"php_api_no\": \"${PHP_API_NO}\","
                echo "  \"zts\": 1,"
                echo "  \"libc\": \"gnu\","
                echo "  \"arch\": \"$(uname -m)\","
                echo "  \"extensions\": ["
                first=1
                for so in *.so; do
                  name="${so%.so}"
                  ver=$(strings "$so" 2>/dev/null | grep -E "^${name} [0-9]" | head -n 1 | awk "{print \$2}")
                  if [ "$name" = "xdebug" ]; then
                    if ! strings "$so" | grep -qxF "${XDEBUG_VERSION}"; then
                      echo "::error::xdebug.so does not carry version string ${XDEBUG_VERSION}" >&2
                      exit 1
                    fi
                    ver="${XDEBUG_VERSION}"
                  fi
                  if [ -z "$ver" ]; then ver="unknown"; fi
                  zend_ext=false
                  if nm -D --defined-only "$so" 2>/dev/null | grep -qw "zend_extension_entry"; then
                    zend_ext=true
                  fi
                  sha=$(sha256sum "$so" | cut -d" " -f1)
                  if [ "$first" -eq 0 ]; then echo "    ,"; fi
                  first=0
                  echo "    {"
                  echo "      \"name\": \"${name}\","
                  echo "      \"file\": \"${so}\","
                  echo "      \"version\": \"${ver}\","
                  echo "      \"php_api_no\": \"${PHP_API_NO}\","
                  echo "      \"zts\": 1,"
                  echo "      \"zend_extension\": ${zend_ext},"
                  echo "      \"sha256\": \"${sha}\""
                  echo "    }"
                done
                echo "  ]"
                echo "}"
              } > /output/ext/manifest.json
              echo "==> manifest.json:"
              cat /output/ext/manifest.json
              jq . /output/ext/manifest.json > /dev/null && echo "==> manifest.json is valid JSON"
            '

          # Copy staged artifacts out of the stopped container. Use the plain
          # src-dir form (not /output/.) per build.yml to avoid double nesting.
          docker cp "spc-ext-${{ matrix.libc }}:/output/ext" ./ext-out
          docker rm "spc-ext-${{ matrix.libc }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package extension catalog
        run: |
          ls -lh ext-out/
          test -f ext-out/manifest.json || { echo "::error::manifest.json missing"; exit 1; }
          # Fail if not a single .so made it through (all deferred).
          so_count=$(find ext-out -name "*.so" -type f | wc -l)
          if [ "$so_count" -eq 0 ]; then
            echo "::error::no .so files in ext-out - every extension deferred"
            exit 1
          fi
          echo "==> $so_count extension .so file(s) packaged"
          tar czf ephpm-ext-${{ inputs.php_version }}-linux-${{ matrix.arch }}${{ matrix.suffix }}.tar.gz -C ext-out .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ephpm-ext-${{ inputs.php_version }}-linux-${{ matrix.arch }}${{ matrix.suffix }}
          path: ephpm-ext-${{ inputs.php_version }}-linux-${{ matrix.arch }}${{ matrix.suffix }}.tar.gz

  # macOS arm64 catalog. Same toolchain as build.yml build-macos (spc
  # micro-PHP binary, Homebrew deps via spc doctor, Homebrew LLVM because
  # Apple clang crashes on the JIT), same pinned php-src and xdebug inputs as
  # the Linux job. The ePHPm macOS binary exports the PHP symbols, and the
  # bundles are linked with undefined PHP symbols resolved at dlopen time, so
  # the TSRM check below runs against the undefined-symbol table: a bundle
  # that had libphp.a linked into it would carry its own engine copy.
  build-extensions-macos:
    name: Extensions (aarch64, macos)
    needs: setup
    if: needs.setup.outputs.build-macos == 'true'
    runs-on: [self-hosted, macos, arm64]
    env:
      PHP_VERSION: ${{ inputs.php_version }}
      SPC_WITH_PHP: ${{ needs.setup.outputs.spc-version }}
      PHP_SRC_URL: ${{ inputs.php_src_url }}
      PRERELEASE: ${{ needs.setup.outputs.prerelease }}
      XDEBUG_VERSION: ${{ needs.setup.outputs.xdebug-version }}
      XDEBUG_SHA256: ${{ needs.setup.outputs.xdebug-sha256 }}
      EXTENSIONS: ${{ inputs.extensions }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Clean up previous builds
        run: rm -rf buildroot source downloads ext-out ./*.tar.gz

      - name: Download spc
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL "https://github.com/luthermonson/static-php-cli/releases/download/${{ env.SPC_VERSION }}/spc-macos-aarch64.tar.gz" \
            | tar xz -C "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Install Homebrew + build deps via spc doctor
        env:
          NONINTERACTIVE: "1"
        run: |
          i=0
          until spc doctor --auto-fix; do
            i=$((i + 1))
            if [ "$i" -ge 5 ]; then
              echo "spc doctor failed after $i attempts" >&2
              exit 1
            fi
            sleep $((RANDOM % 4 + 3))
          done

      - name: Install LLVM and prepend to PATH
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Download sources
        run: |
          if [ -n "${PHP_SRC_URL}" ]; then
            php_src_fetch_url="${PHP_SRC_URL}"
          else
            php_src_fetch_url="https://github.com/ephpm/php-sdk/releases/download/php-sources/php-${PHP_VERSION}.tar.gz"
          fi
          j=0
          until curl -fsSL -o /tmp/php-src-mirror.tar.gz "${php_src_fetch_url}"; do
            j=$((j + 1))
            if [ "$j" -ge 5 ]; then
              echo "php-src fetch failed after $j attempts (${php_src_fetch_url})" >&2
              exit 1
            fi
            sleep 3
          done

          CUSTOM_URLS="--custom-url=php-src:file:///tmp/php-src-mirror.tar.gz"
          mkdir -p /tmp/deps
          if curl -fsSL -o /tmp/deps/manifest.txt \
              "https://github.com/ephpm/php-sdk/releases/download/php-sources/gnu-deps-manifest.txt"; then
            while read -r dep_name dep_file; do
              if [ -z "${dep_name}" ] || [ -z "${dep_file}" ]; then
                continue
              fi
              if curl -fsSL -o "/tmp/deps/${dep_file}" \
                  "https://github.com/ephpm/php-sdk/releases/download/php-sources/${dep_file}"; then
                CUSTOM_URLS="${CUSTOM_URLS} --custom-url=${dep_name}:file:///tmp/deps/${dep_file}"
              fi
            done < /tmp/deps/manifest.txt
          fi

          case ",${EXTENSIONS}," in
            *,xdebug,*)
              if [ -z "${XDEBUG_VERSION}" ]; then
                echo "::error::no pinned xdebug version for PHP ${PHP_VERSION}"
                exit 1
              fi
              curl -fsSL --retry 5 -o /tmp/xdebug-src.tar.gz \
                "https://github.com/xdebug/xdebug/archive/refs/tags/${XDEBUG_VERSION}.tar.gz"
              echo "${XDEBUG_SHA256}  /tmp/xdebug-src.tar.gz" | shasum -a 256 -c -
              CUSTOM_URLS="${CUSTOM_URLS} --custom-url=ext-xdebug:file:///tmp/xdebug-src.tar.gz"
              ;;
          esac

          i=0
          # shellcheck disable=SC2086
          until spc download \
              --with-php=${SPC_WITH_PHP} \
              --for-extensions=pcre,mbstring,session,openssl,hash,json,filter,${EXTENSIONS} \
              ${CUSTOM_URLS} \
              --prefer-pre-built; do
            i=$((i + 1))
            if [ "$i" -ge 8 ]; then
              echo "spc download failed after $i attempts" >&2
              exit 1
            fi
            sleep $((5 * i))
          done

      - name: Build shared extensions
        run: |
          # PHP < 8.4 uses K&R declarations removed in C23 (see build.yml).
          php_minor=$(echo "${PHP_VERSION}" | cut -d. -f2)
          if [ "$php_minor" -lt 4 ]; then
            export CFLAGS="-std=gnu17"
          fi
          BUILD_SAPI_EXTRA=""
          if [ "${PRERELEASE}" = "true" ]; then
            export SPC_MICRO_PATCHES=
            export SPC_CMD_PREFIX_PHP_CONFIGURE="./configure --prefix= --with-valgrind=no --disable-shared --enable-static --disable-all --disable-phpdbg --enable-rtld-now --enable-re2c-cgoto --disable-rpath --enable-pic"
            BUILD_SAPI_EXTRA="--build-cli"
          fi
          DL_XDEBUG=""
          if [ -f /tmp/xdebug-src.tar.gz ]; then
            DL_XDEBUG="--dl-custom-url=ext-xdebug:file:///tmp/xdebug-src.tar.gz"
          fi
          # shellcheck disable=SC2086
          spc build pcre,mbstring,session,openssl,hash,json,filter \
            --dl-with-php=${SPC_WITH_PHP} \
            --dl-custom-url=php-src:file:///tmp/php-src-mirror.tar.gz \
            ${DL_XDEBUG} \
            ${BUILD_SAPI_EXTRA} \
            --build-embed \
            --enable-zts \
            --no-strip \
            --build-shared=${EXTENSIONS} || {
              tail -n 100 log/spc.shell.log || true
              exit 1
            }

      - name: Verify and write manifest
        run: |
          staged=$(sed -n 's/^#define PHP_VERSION "\(.*\)"/\1/p' "$(find buildroot/include -name php_version.h -path '*main*' | head -n 1)")
          if [ "$staged" != "${PHP_VERSION}" ]; then
            echo "::error::extensions built against PHP $staged but asked for ${PHP_VERSION}"
            exit 1
          fi
          PHP_API_NO=$(sed -n 's/^#define ZEND_MODULE_API_NO \([0-9]*\).*/\1/p' "$(find buildroot/include -name zend_modules.h | head -n 1)")

          mkdir -p ext-out
          for ext in $(echo "${EXTENSIONS}" | tr "," " "); do
            so=$(find buildroot -name "${ext}.so" -type f | head -n 1)
            if [ -z "$so" ]; then
              echo "::warning::no .so produced for ${ext}"
              continue
            fi
            cp -Lf "$so" ext-out/
          done
          ls ext-out/*.so >/dev/null 2>&1 || { echo "::error::no shared extension .so files were produced"; exit 1; }

          for so in ext-out/*.so; do
            file "$so"
            defined=$(nm -gUj "$so")
            undefined=$(nm -uj "$so")
            if ! grep -Eq "^_(get_module|zend_extension_entry)$" <<< "$defined"; then
              echo "::error::$so exports neither get_module nor zend_extension_entry"
              exit 1
            fi
            if ! grep -Eq "_globals_offset$|_globals_id$|^_ts_allocate_id$|^_tsrm_get_ls_cache$" <<< "$undefined"; then
              echo "::error::$so does not import TSRM accessors - NTS build or PHP linked into the bundle"
              exit 1
            fi
            if grep -Eq "^_(compiler_globals_offset|executor_globals_offset|zend_register_functions)$" <<< "$defined"; then
              echo "::error::$so defines engine symbols - libphp was linked into the bundle"
              exit 1
            fi
          done

          cd ext-out
          {
            echo "{"
            echo "  \"php_version\": \"${PHP_VERSION}\","
            echo "  \"php_api_no\": \"${PHP_API_NO}\","
            echo "  \"zts\": 1,"
            echo "  \"os\": \"macos\","
            echo "  \"arch\": \"aarch64\","
            echo "  \"extensions\": ["
            first=1
            for so in *.so; do
              name="${so%.so}"
              ver=$(strings "$so" | grep -E "^${name} [0-9]" | head -n 1 | awk '{print $2}')
              if [ "$name" = "xdebug" ]; then
                strings "$so" | grep -qxF "${XDEBUG_VERSION}" || { echo "::error::xdebug.so lacks version ${XDEBUG_VERSION}"; exit 1; }
                ver="${XDEBUG_VERSION}"
              fi
              [ -n "$ver" ] || ver="unknown"
              zend_ext=false
              if nm -gUj "$so" | grep -Ec "^_zend_extension_entry$" > /dev/null; then zend_ext=true; fi
              sha=$(shasum -a 256 "$so" | cut -d" " -f1)
              if [ "$first" -eq 0 ]; then echo "    ,"; fi
              first=0
              echo "    {"
              echo "      \"name\": \"${name}\","
              echo "      \"file\": \"${so}\","
              echo "      \"version\": \"${ver}\","
              echo "      \"php_api_no\": \"${PHP_API_NO}\","
              echo "      \"zts\": 1,"
              echo "      \"zend_extension\": ${zend_ext},"
              echo "      \"sha256\": \"${sha}\""
              echo "    }"
            done
            echo "  ]"
            echo "}"
          } > manifest.json
          cat manifest.json
          python3 -m json.tool manifest.json > /dev/null

      - name: Package extension catalog
        run: tar czf "ephpm-ext-${PHP_VERSION}-macos-aarch64.tar.gz" -C ext-out .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ephpm-ext-${{ inputs.php_version }}-macos-aarch64
          path: ephpm-ext-${{ inputs.php_version }}-macos-aarch64.tar.gz

  release:
    name: Create extension release
    needs: [setup, build-extensions, build-extensions-macos]
    # Only main publishes. A branch run would otherwise replace the
    # production ext-<ver> assets with .so files built from whatever pie
    # resolves today; branch runs are validated from their workflow artifacts.
    # A failed macOS leg does not hold back the Linux catalog.
    if: |
      always()
      && github.ref == 'refs/heads/main'
      && needs.build-extensions.result != 'failure'
      && (needs.build-extensions.result == 'success'
          || needs.build-extensions-macos.result == 'success')
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/ || { echo "::error::no artifacts produced"; exit 1; }

      - name: Create or update extension release
        uses: softprops/action-gh-release@v2
        # Separate tag from the SDK releases (v<ver>): ext-<ver>. action-gh-release
        # replaces only the assets whose filenames match, so a partial rebuild
        # (one arch) leaves the other arch tarball attached to ext-<ver>.
        with:
          tag_name: ext-${{ inputs.php_version }}
          name: PHP ${{ inputs.php_version }} ZTS extensions
          prerelease: ${{ needs.setup.outputs.prerelease == 'true' }}
          body: |
            Loadable ZTS shared extensions (Linux glibc, macOS arm64) for ephpm PHP ${{ inputs.php_version }}.

            **PHP version:** ${{ inputs.php_version }}
            **Requested extensions:** ${{ inputs.extensions }}

            These .so files match the ephpm ABI: same PHP minor + ZTS +
            non-debug, and glibc on Linux. Load regular extensions via ephpm
            `[php] extensions = [...]`. Debian and Sury publish no ZTS
            extension builds, so this is the primary source.

            **macOS:** needs an ephpm binary linked with `-export_dynamic`
            (releases after v0.11.3); older macOS binaries fail with `symbol
            not found in flat namespace`.

            **Load order (every platform):** PHP is built with
            `--enable-rtld-now`, so an extension's symbols bind when it loads.
            List an extension after the ones it depends on: `igbinary` and
            `msgpack` before `redis`. The manifest order is alphabetical and
            is not a load order.

            Each tarball contains the `.so` files plus a `manifest.json`
            (ext name, version, php_api_no, zts=1, zend_extension, sha256 per
            file). Entries with `"zend_extension": true` (xdebug) must be loaded
            with `zend_extension=<absolute path>`, not `extension=`.

            **Xdebug:** ${{ needs.setup.outputs.xdebug-version }} (pinned)

            ## Artifacts

            | File | Platform |
            |------|----------|
            | `ephpm-ext-${{ inputs.php_version }}-linux-x86_64-gnu.tar.gz` | Linux x86_64 (glibc, ZTS) |
            | `ephpm-ext-${{ inputs.php_version }}-linux-aarch64-gnu.tar.gz` | Linux aarch64 (glibc, ZTS) |
            | `ephpm-ext-${{ inputs.php_version }}-macos-aarch64.tar.gz` | macOS arm64 (ZTS) |
          files: artifacts/*.tar.gz
